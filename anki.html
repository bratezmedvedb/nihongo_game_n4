<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>JLPT • Тренажёр</title>

  <!-- Google Fonts: Японский округлый шрифт -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <!-- Авто-раскрытие Telegram -->
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      if (tg.requestFullscreen) tg.requestFullscreen();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    }
  </script>

  <style>
    :root {
      --cream: #fbf8ee;
      --paper: #ffffff;
      --ink: #4a3a36;
      --ink-soft: #8f8478;

      --strawberry: #ffc4d0;
      --strawberry-deep: #ec6f88;

      --matcha: #d5e8b3;
      --matcha-deep: #8db55a;

      --peach: #ffd8bb;
      --peach-deep: #f0a06c;

      --pistachio: #cdeec4;
      --pistachio-deep: #78bf74;

      --apricot: #ffe6cc;
      --line: #ebdacf;
      --line-subtle: #f3e9e2;

      --danger-bg: #ffe4e6;
      --danger-border: #fca5a5;
      --danger-text: #be123c;

      --shadow-sm: 0 3px 0 var(--line);
      --shadow-card: 0 8px 24px rgba(74, 58, 54, 0.07);

      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--cream);
      color: var(--ink);
      font-family: 'M PLUS Rounded 1c', 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      position: relative;
    }

    body {
      background-image: 
        radial-gradient(circle at 12% 15%, rgba(255, 196, 208, 0.35) 0%, transparent 40%),
        radial-gradient(circle at 88% 85%, rgba(213, 232, 179, 0.35) 0%, transparent 40%);
      background-attachment: fixed;
    }

    /* Анимация падающих лепестков сакуры */
    .petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .petals span {
      position: absolute;
      top: -30px;
      width: 14px;
      height: 11px;
      background: var(--strawberry);
      border-radius: 80% 0 80% 0;
      opacity: 0.75;
      animation: fallSakura 14s linear infinite;
    }
    .petals span:nth-child(1) { left: 8%;  animation-delay: 0s;   animation-duration: 15s; }
    .petals span:nth-child(2) { left: 24%; animation-delay: -5s;  animation-duration: 18s; width: 10px; height: 8px; }
    .petals span:nth-child(3) { left: 42%; animation-delay: -9s;  animation-duration: 16s; background: var(--peach); }
    .petals span:nth-child(4) { left: 61%; animation-delay: -3s;  animation-duration: 20s; width: 12px; height: 9px; }
    .petals span:nth-child(5) { left: 78%; animation-delay: -11s; animation-duration: 17s; background: var(--matcha); }
    .petals span:nth-child(6) { left: 92%; animation-delay: -7s;  animation-duration: 19s; }

    @keyframes fallSakura {
      0%   { transform: translate(0, 0) rotate(0deg); }
      50%  { transform: translate(28px, 55vh) rotate(180deg); }
      100% { transform: translate(-12px, 110vh) rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .petals { display: none; }
    }

    /* Контейнер приложения */
    #app {
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    body.desktop-device #app {
      max-width: 600px !important;
      width: 100% !important;
    }

    /* Верхняя панель сессий */
    .session-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(44px + env(safe-area-inset-top, 0px)) 16px 8px;
      flex-shrink: 0;
      width: 100%;
      z-index: 10;
    }

    body.is-android .session-header {
      padding-top: 75px !important;
    }

    .back-btn-pill {
      background: var(--paper);
      border: 2px solid var(--line);
      color: var(--ink);
      font-size: 0.85rem;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: 99px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      box-shadow: 0 3px 0 var(--line);
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .back-btn-pill:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--line);
    }

.session-progress-wrap {
  flex: 1;
  height: 10px;
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 8px;
  margin: 0 12px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 6px;
  transition: width 0.35s ease;
  background: repeating-linear-gradient(135deg, var(--strawberry) 0 10px, #ffe3e8 10px 20px);
}

    .session-counter-text {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--ink-soft);
      min-width: 45px;
      text-align: right;
    }

.view {
      display: none !important;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      animation: fadeIn 0.18s ease-out;
    }
    .view.active {
      display: flex !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.99); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ==========================================================================
       ЭКРАН 1: КАРТА
       ========================================================================== */
    #viewMap {
      flex: 1 1 auto !important;
      height: 100% !important;
      min-height: 0 !important;
      overflow-y: scroll !important;
      overflow-x: hidden !important;
      -webkit-overflow-scrolling: touch;
      padding: calc(44px + env(safe-area-inset-top, 0px)) 12px calc(60px + env(safe-area-inset-bottom, 0px));
      position: relative;
    }

    body.is-android #viewMap {
      padding-top: 75px !important;
    }

    /* Кнопка звука в главном меню */
    .map-sound-btn {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: 16px;
      z-index: 50;
      background: var(--paper);
      border: 2px solid var(--peach);
      border-radius: 99px;
      padding: 6px 14px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      color: var(--ink);
      box-shadow: 0 3px 0 var(--peach);
      transition: all 0.15s ease;
    }
    .map-sound-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--peach);
    }
    body.is-android .map-sound-btn {
      top: 45px !important;
    }

    .snake-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      padding: 24px 0 90px;
      position: relative;
      min-height: 100%;
    }

 #snakeSvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: visible !important;
    }

    .level-node-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .level-node {
      width: 76px;
      height: 76px;
      border-radius: var(--radius-xl);
      background: var(--paper);
      border: 2.5px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--line);
      transition: all 0.12s ease;
      position: relative;
    }
    .level-node:active {
      transform: translateY(3px) scale(0.96);
      box-shadow: 0 2px 0 var(--line);
    }

    .level-node.review-node {
      background: #fff8f0;
      border-color: var(--peach-deep);
      box-shadow: 0 5px 0 var(--peach);
      color: var(--peach-deep);
      width: 80px;
      height: 80px;
    }

    .level-node.active-unlocked {
      background: var(--pistachio);
      border-color: var(--pistachio-deep);
      box-shadow: 0 6px 0 var(--pistachio-deep);
      color: var(--ink);
      transform: scale(1.06);
    }
    .level-node.active-unlocked:active {
      transform: translateY(3px) scale(1.0);
      box-shadow: 0 2px 0 var(--pistachio-deep);
    }

    .level-node.locked {
      background: var(--paper);
      border: 2px dashed var(--line);
      color: var(--ink-soft);
      cursor: not-allowed;
      opacity: 1;
      box-shadow: none;
    }
    .level-node.locked::after {
      content: '🔒';
      font-size: 11px;
      position: absolute;
      top: 6px;
      right: 7px;
      opacity: 0.6;
    }

    .node-num {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1;
      color: var(--ink);
    }

    .node-progress {
      font-size: 0.68rem;
      font-weight: 800;
      margin-top: 3px;
      padding: 1px 7px;
      border-radius: 99px;
      background: var(--paper);
      border: 1px solid var(--line);
      color: var(--ink-soft);
    }

    .active-unlocked .node-progress {
      border-color: var(--pistachio-deep);
      color: var(--ink);
    }

    .pos-0 { transform: translateX(0); }
    .pos-1 { transform: translateX(50px); }
    .pos-2 { transform: translateX(0); }
    .pos-3 { transform: translateX(-50px); }

    body.desktop-device .pos-1 { transform: translateX(120px); }
    body.desktop-device .pos-3 { transform: translateX(-120px); }

    /* ==========================================================================
       ЭКРАН 2: ANKI
       ========================================================================== */
    #viewAnki {
      padding: 0 16px calc(18px + env(safe-area-inset-bottom, 0px));
      justify-content: space-between;
      width: 100%;
      height: 100%;
    }

    .anki-toggle-mode {
      display: flex;
      background: var(--paper);
      border: 2px solid var(--line);
      padding: 3px;
      border-radius: 99px;
      margin: 0 auto 10px;
      width: 130px;
      gap: 4px;
      flex-shrink: 0;
      box-shadow: 0 2px 0 var(--line);
    }

    .anki-toggle-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 6px 0;
      font-size: 1rem;
      border-radius: 99px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .anki-toggle-btn.active {
      background: var(--peach);
      box-shadow: 0 2px 0 var(--peach-deep);
    }

    .presentation-card-anki {
      flex: 1;
      min-height: 0;
      width: 100%;
      background: var(--paper);
      border: 2.5px solid var(--line);
      border-radius: var(--radius-xl);
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: var(--shadow-card);
      position: relative;
      margin-bottom: 14px;
    }

    .card-badge {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 99px;
      background: var(--cream);
      color: var(--ink-soft);
      border: 1.5px solid var(--line);
    }

    .card-question {
      font-weight: 500;
      color: var(--ink);
      line-height: 1.15;
      margin: auto 0;
      width: 100%;
      word-break: break-word;
      transition: font-size 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-answer-block {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 2px dashed var(--line);
      width: 100%;
      position: relative;
    }
    .card-answer-block.revealed { display: flex; }

    .card-reading-row {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      min-height: 38px;
    }

    .card-reading {
      font-size: clamp(1.3rem, 4.5vw, 1.8rem);
      color: var(--ink-soft);
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      cursor: pointer;
      padding: 0 44px;
    }

    .action-circle-voice-btn {
      position: absolute;
      right: 6px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--peach);
      background: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      cursor: pointer;
      color: var(--ink);
      box-shadow: 0 3px 0 var(--peach);
      transition: all 0.15s ease;
    }
    .action-circle-voice-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--peach);
    }

    .card-translation {
      font-size: clamp(1.15rem, 3.4vw, 1.45rem);
      font-weight: 800;
      color: var(--strawberry-deep);
    }

    .anki-actions-bottom {
      flex-shrink: 0;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .btn-show-answer {
      width: 100%;
      height: 54px;
      border-radius: var(--radius-lg);
      background: var(--strawberry-deep);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 0 #c9546b;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .btn-show-answer:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #c9546b;
    }

    .anki-grade-group {
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .btn-grade {
      height: 54px;
      border-radius: var(--radius-md);
      border: 2px solid var(--line);
      background: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0 4px;
      font-family: inherit;
      box-shadow: 0 3px 0 var(--line);
      transition: all 0.1s ease;
    }
    .btn-grade:active {
      transform: translateY(2px);
    }
    .btn-grade .grade-label {
      font-size: 0.95rem;
      font-weight: 800;
    }

    .btn-grade.again {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
      box-shadow: 0 3px 0 var(--danger-border);
    }
    .btn-grade.hard {
      background: #fff5ec;
      border-color: var(--peach);
      color: var(--peach-deep);
      box-shadow: 0 3px 0 var(--peach);
    }
    .btn-grade.good {
      background: #f3f9e8;
      border-color: var(--matcha);
      color: var(--matcha-deep);
      box-shadow: 0 3px 0 var(--matcha);
    }
    .btn-grade.easy {
      background: #eef7eb;
      border-color: var(--pistachio);
      color: var(--pistachio-deep);
      box-shadow: 0 3px 0 var(--pistachio);
    }

    /* ==========================================================================
       ЭКРАН 3: СТОПКА
       ========================================================================== */
    #viewStack {
      padding: 0 12px calc(14px + env(safe-area-inset-bottom, 0px));
      width: 100%;
      height: 100%;
      flex-direction: column;
    }

    .stack-sub-hint {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink-soft);
      text-align: center;
      margin: 2px 0 10px;
      flex-shrink: 0;
    }

    .stack-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
    }

    .stack-tile {
      background: var(--paper);
      border: 2px solid var(--line);
      border-radius: var(--radius-lg);
      height: 100% !important;
      width: 100% !important;
      min-height: 0;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--line);
      transition: all 0.15s ease;
      position: relative;
      overflow: hidden;
    }
    .stack-tile:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--line);
    }

    .stack-tile.selected {
      background: var(--apricot);
      border-color: var(--peach-deep);
      color: var(--ink);
      box-shadow: 0 4px 0 var(--peach-deep);
    }

    .stack-tile.empty-slot {
      visibility: hidden;
      pointer-events: none;
    }

    .stack-tile.merge-pulse {
      animation: pulseGreen 0.28s ease;
    }
    @keyframes pulseGreen {
      0%, 100% { transform: scale(1); }
      50% {
        transform: scale(1.06);
        background: #f3f9e8;
        border-color: var(--matcha-deep);
      }
    }

    .stack-tile.completed-burst {
      animation: burstOut 0.3s forwards;
    }
    @keyframes burstOut {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); background: var(--pistachio); }
      100% { transform: scale(0.2); opacity: 0; }
    }

    .stack-tile.error {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
      animation: shake 0.3s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .tile-counter-badge {
      position: absolute;
      top: 4px;
      right: 5px;
      font-size: 0.62rem;
      font-weight: 800;
      background: var(--cream);
      border: 1px solid var(--line);
      color: var(--ink-soft);
      padding: 1px 6px;
      border-radius: 99px;
    }

    .tile-main-text {
      font-weight: 800;
      line-height: 1.15;
      color: var(--ink);
      word-break: break-word;
      overflow-wrap: break-word;
      hyphens: auto;
      padding: 0 6px;
      width: 100%;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tile-main-text.type-kanji {
      font-size: clamp(2.4rem, 9.5vw, 3.2rem) !important;
      font-weight: 500;
    }
    .tile-main-text.type-reading {
      font-size: clamp(1.6rem, 6.8vw, 2.2rem);
    }
    .tile-main-text.type-translation {
      font-weight: 800;
      line-height: 1.18;
      font-size: clamp(1.15rem, 4.8vw, 1.45rem);
    }

    .tile-main-text.size-sm {
      font-size: clamp(0.85rem, 3.3vw, 1.05rem) !important;
      line-height: 1.15;
    }
    .tile-main-text.size-xs {
      font-size: clamp(0.75rem, 2.8vw, 0.9rem) !important;
      line-height: 1.1;
    }

    .tile-sub-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      justify-content: center;
      margin-top: 4px;
      max-width: 100%;
    }

    .chip-item {
      font-size: 0.65rem;
      font-weight: 800;
      background: var(--cream);
      color: var(--strawberry-deep);
      border: 1px solid var(--strawberry);
      padding: 1px 5px;
      border-radius: 6px;
      white-space: nowrap;
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ШТОРКА ВЫБОРА РЕЖИМА */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(74, 58, 54, 0.45);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
    }
    .modal-backdrop.open { display: flex; }

    .modal-sheet {
      background: var(--cream);
      width: 100%;
      max-width: 480px;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 20px 18px calc(24px + env(safe-area-inset-bottom, 0px));
      border: 2.5px solid var(--line);
      border-bottom: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 -8px 24px rgba(74, 58, 54, 0.1);
    }

    .modal-sheet-handle {
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--line);
      margin: 0 auto 6px;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 800;
      text-align: center;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .btn-pill {
      height: 54px;
      border-radius: var(--radius-lg);
      border: 2px solid var(--line);
      background: var(--paper);
      font-size: 1rem;
      font-weight: 800;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--line);
      font-family: inherit;
      transition: all 0.15s ease;

      const platform = window.Telegram?.WebApp?.platform || '';
      const isDesktopPlatform = ['tdesktop', 'macos', 'web', 'weba', 'webk'].includes(platform);
      const isWideScreen = window.innerWidth >= 768;

      if (isDesktopPlatform || isWideScreen) {
        document.body.classList.add('desktop-device');
      } else {
        document.body.classList.remove('desktop-device');
      }

      if (navigator.userAgent.toLowerCase().includes('android')) {
        document.body.classList.add('is-android');
      }

    ["緊張します", "きんちょうします", "нервничать, волноваться, напрягаться"],
    ["放送", "ほうそう", "трансляция, вещание, передача"],
    ["感謝", "かんしゃ", "благодарность, признательность"],
    ["迷惑", "めいわく", "беспокойство, неудобство, стеснение"]
  ];

  // Автоматически разворачиваем данные в объекты и добавляем в allWords:
  n4WordsData.forEach(([kanji, reading, translation], idx) => {
    allWords.push({
      id: START_N4_ID + idx,
      level_id: START_N4_LEVEL + Math.floor(idx / 20),
      kanji,
      reading,
      translation
    });
  });

  const TOTAL_LEVELS = 73;
  let userProgress = {};

// =========================================================================
    // --- 0. КОНСТАНТЫ SRS И НАСТРОЙКИ (ОБЪЯВЛЕНЫ ДО ХРАНИЛИЩА) ---
    // =========================================================================
    const CARD_STATE = { NEW: 0, LEARNING: 1, REVIEW: 2, RELEARNING: 3 };

    const ANKI_CONFIG = {
      learningSteps: [1, 10],
      graduatingInterval: 1,
      easyInterval: 4,
      startingEase: 2.50,
      minEase: 1.30,
      easyBonus: 1.30,
      hardIntervalFactor: 1.20
    };

    // =========================================================================
    // --- 1. АУДИОДВИЖОК С ПРЕДЗАГРУЗКОЙ (0 мс ЗАДЕРЖКИ) ---
    // =========================================================================
    let isSoundMuted = localStorage.getItem('japandi_sound_muted') === 'true';
    const audioCache = new Map();
    let currentPlayingAudio = null;

    function updateSoundBtnUI() {
      const icon = document.getElementById('soundIcon');
      if (icon) icon.innerText = isSoundMuted ? '🔇' : '🔊';
    }

    function toggleGameSound() {
      isSoundMuted = !isSoundMuted;
      localStorage.setItem('japandi_sound_muted', isSoundMuted ? 'true' : 'false');
      if (isSoundMuted && currentPlayingAudio) {
        currentPlayingAudio.pause();
      }
      updateSoundBtnUI();
    }

    function preloadWordAudio(wordId) {
      if (isSoundMuted || !wordId || audioCache.has(wordId)) return;
      try {
        const audio = new Audio();
        audio.preload = 'auto';
        audio.src = `audio/${wordId}.mp3`;
        audioCache.set(wordId, audio);
      } catch (e) {}
    }

    function speakKyoko(wordId) {
      if (isSoundMuted || !wordId) return;
      try {
        let audio = audioCache.get(wordId);
        if (!audio) {
          audio = new Audio(`audio/${wordId}.mp3`);
          audioCache.set(wordId, audio);
        }
        
        if (currentPlayingAudio && currentPlayingAudio !== audio) {
          currentPlayingAudio.pause();
          currentPlayingAudio.currentTime = 0;
        }

        audio.currentTime = 0;
        currentPlayingAudio = audio;
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {});
        }
      } catch (e) {
        console.error('Audio error:', e);
      }
    }

    function preloadCurrentAudio(wordId) {
      preloadWordAudio(wordId);
    }

    // =========================================================================
    // --- 2. ОБЛАЧНОЕ СОХРАНЕНИЕ V2 (ДИФФ-СИНХРОНИЗАЦИЯ, МИГРАЦИЯ, SM-2) ---
    // =========================================================================
    const CHUNK_SIZE = 120; // 120 слов гарантированно занимают ~2.5 КБ при лимите 4096 байт
    const BASE_EPOCH = 1735689600000; // 2025-01-01
    const lastSyncedChunks = new Map();

    const CloudStorage = {
      setItem(key, value) {
        return new Promise((resolve, reject) => {
          if (!window.Telegram?.WebApp?.CloudStorage) return resolve(false);
          const size = new Blob([value]).size;
          if (size > 4096) {
            console.error(`[CloudStorage] ${key} size ${size}B > 4096B`);
            return reject(new Error(`Size limit exceeded: ${size} bytes`));
          }
          window.Telegram.WebApp.CloudStorage.setItem(key, value, (err, success) => {
            if (err || !success) reject(err || new Error('Write failed'));
            else resolve(true);
          });
        });
      },
      getItems(keys) {
        return new Promise((resolve, reject) => {
          if (!window.Telegram?.WebApp?.CloudStorage) return resolve({});
          window.Telegram.WebApp.CloudStorage.getItems(keys, (err, res) => {
            if (err) reject(err);
            else resolve(res || {});
          });
        });
      },
      removeItems(keys) {
        return new Promise(resolve => {
          if (!window.Telegram?.WebApp?.CloudStorage || !keys.length) return resolve();
          window.Telegram.WebApp.CloudStorage.removeItems(keys, () => resolve());
        });
      }
    };

    function serializeCard(id, p) {
      const r = p.reps || 0;
      const i = p.interval || 0;
      const e = Math.round((p.easeFactor || ANKI_CONFIG.startingEase) * 100);
      const dueDays = p.dueDate ? Math.max(0, Math.floor((p.dueDate - BASE_EPOCH) / 86400000)) : 0;
      const lapses = p.lapses || 0;
      const state = p.state !== undefined ? p.state : (p.stacked ? CARD_STATE.REVIEW : CARD_STATE.NEW);
      const step = p.step || 0;
      const flags = (p.stacked ? 1 : 0) | (p.ankiMastered ? 2 : 0);

      return `${id}:${r}:${i}:${e}:${dueDays}:${lapses}:${state}:${step}:${flags}`;
    }

    function deserializeCard(str) {
      if (!str || typeof str !== 'string') return null;
      const parts = str.split(':');
      if (parts.length < 9) return null;

      const [id, r, i, e, dueDays, lapses, state, step, flags] = parts.map(Number);
      if (!Number.isFinite(id) || id <= 0) return null;

      return {
        id,
        reps: r || 0,
        interval: i || 0,
        easeFactor: e ? e / 100 : ANKI_CONFIG.startingEase,
        dueDate: dueDays ? BASE_EPOCH + (dueDays * 86400000) : 0,
        lapses: lapses || 0,
        state: state !== undefined ? state : CARD_STATE.NEW,
        step: step || 0,
        stacked: Boolean(flags & 1),
        ankiMastered: Boolean(flags & 2)
      };
    }

    let saveDebounceTimer = null;
    function saveState() {
      try {
        localStorage.setItem('japandi_backup_data', JSON.stringify(userProgress));
      } catch (e) {
        console.error('LocalStorage write error:', e);
      }

      clearTimeout(saveDebounceTimer);
      saveDebounceTimer = setTimeout(syncToCloudStorage, 1500);
    }

    async function syncToCloudStorage() {
      if (!window.Telegram?.WebApp?.CloudStorage) return;

      try {
        const dirtyCards = [];
        for (const [idStr, p] of Object.entries(userProgress)) {
          const id = Number(idStr);
          if (p.stacked || p.ankiMastered || p.reps > 0 || p.interval > 0 || (p.state && p.state > 0)) {
            dirtyCards.push(serializeCard(id, p));
          }
        }

        const chunks = [];
        for (let i = 0; i < dirtyCards.length; i += CHUNK_SIZE) {
          chunks.push(dirtyCards.slice(i, i + CHUNK_SIZE).join(';'));
        }

        const writePromises = [];
        let modifiedChunksCount = 0;

        chunks.forEach((chunkStr, idx) => {
          const key = `tg_v2_c${idx}`;
          if (lastSyncedChunks.get(key) !== chunkStr) {
            writePromises.push(
              CloudStorage.setItem(key, chunkStr).then(() => {
                lastSyncedChunks.set(key, chunkStr);
              })
            );
            modifiedChunksCount++;
          }
        });

        if (modifiedChunksCount > 0 || !lastSyncedChunks.has('tg_v2_meta')) {
          const metaStr = JSON.stringify({
            v: 2,
            chunks: chunks.length,
            total: dirtyCards.length,
            updatedAt: Date.now()
          });
          writePromises.push(
            CloudStorage.setItem('tg_v2_meta', metaStr).then(() => {
              lastSyncedChunks.set('tg_v2_meta', metaStr);
            })
          );
        }

        if (writePromises.length > 0) {
          await Promise.all(writePromises);
          console.log(`[CloudStorage] Synced ${modifiedChunksCount} chunks (${dirtyCards.length} words total)`);
        }
      } catch (err) {
        console.error('[CloudStorage] Sync error:', err);
      }
    }

    async function loadState(callback) {
      let loadedFromLocal = false;

      try {
        const local = localStorage.getItem('japandi_backup_data');
        if (local) {
          userProgress = JSON.parse(local);
          loadedFromLocal = true;

          if (!localStorage.getItem('japandi_v1_migrated')) {
            localStorage.setItem('japandi_v1_emergency_backup', local);
            localStorage.setItem('japandi_v1_migrated', 'true');
          }
        }
      } catch (e) {
        console.error('LocalStorage load error:', e);
        userProgress = {};
      }

      renderMap();

      if (!window.Telegram?.WebApp?.CloudStorage) {
        if (callback) callback();
        return;
      }

      try {
        const metaRes = await CloudStorage.getItems(['tg_v2_meta']);
        let shouldCleanLegacy = false;

        if (metaRes.tg_v2_meta) {
          const meta = JSON.parse(metaRes.tg_v2_meta);
          if (meta.chunks > 0) {
            const chunkKeys = Array.from({ length: meta.chunks }, (_, i) => `tg_v2_c${i}`);
            const chunksData = await CloudStorage.getItems(chunkKeys);

            for (const key of chunkKeys) {
              const raw = chunksData[key];
              if (raw) {
                lastSyncedChunks.set(key, raw);
                raw.split(';').forEach(cardStr => {
                  const card = deserializeCard(cardStr);
                  if (card) {
                    const existing = userProgress[card.id];
                    if (!existing || (card.reps >= (existing.reps || 0))) {
                      userProgress[card.id] = card;
                    }
                  }
                });
              }
            }
          }
        } else if (!loadedFromLocal) {
          console.log('[CloudStorage] Migrating legacy tg_p1..3...');
          const legacyData = await CloudStorage.getItems(['tg_p1', 'tg_p2', 'tg_p3']);

          const unpackLegacyChunk = (rawStr) => {
            if (!rawStr) return;
            rawStr.split(';').forEach(item => {
              if (!item) return;
              const [id, r, i, s, a] = item.split(':').map(Number);
              if (id) {
                const reps = r || 0;
                const interval = i || 0;
                userProgress[id] = {
                  id,
                  reps,
                  interval,
                  easeFactor: ANKI_CONFIG.startingEase,
                  dueDate: interval > 0 ? Date.now() + (interval * 86400000) : 0,
                  lapses: 0,
                  state: reps > 0 ? (interval >= 1 ? CARD_STATE.REVIEW : CARD_STATE.LEARNING) : CARD_STATE.NEW,
                  step: 0,
                  stacked: s === 1,
                  ankiMastered: a === 1
                };
              }
            });
          };

          if (legacyData.tg_p1) unpackLegacyChunk(legacyData.tg_p1);
          if (legacyData.tg_p2) unpackLegacyChunk(legacyData.tg_p2);
          if (legacyData.tg_p3) unpackLegacyChunk(legacyData.tg_p3);

          shouldCleanLegacy = true;
        }

        await syncToCloudStorage();

        if (shouldCleanLegacy) {
          await CloudStorage.removeItems(['tg_p1', 'tg_p2', 'tg_p3']);
          console.log('[CloudStorage] Cleaned up legacy keys tg_p1..3');
        }

        try {
          localStorage.setItem('japandi_backup_data', JSON.stringify(userProgress));
        } catch (e) {}

        renderMap();
      } catch (err) {
        console.error('[CloudStorage] Load error:', err);
      } finally {
        if (callback) callback();
      }
    }

    function getWordData(wordId) {
      if (!userProgress[wordId]) {
        userProgress[wordId] = {
          id: wordId,
          reps: 0,
          interval: 0,
          easeFactor: ANKI_CONFIG.startingEase,
          dueDate: 0,
          lapses: 0,
          state: CARD_STATE.NEW,
          step: 0,
          stacked: false,
          ankiMastered: false
        };
      }
      return userProgress[wordId];
    }

    function isWordMastered(wId) {
      const p = userProgress[wId];
      if (!p) return false;
      const ankiDone = Boolean(p.ankiMastered || (p.reps && p.reps >= 1) || (p.interval && p.interval >= 1));
      const stackDone = Boolean(p.stacked);
      return ankiDone || stackDone;
    }

    function getLevelWords(lvl) {
      return allWords.filter(w => w.level_id === lvl);
    }

    function getLevelMasteredCount(lvl) {
      return getLevelWords(lvl).filter(w => isWordMastered(w.id)).length;
    }

    function getCurrentUnlockedLevel() {
      for (let lvl = 1; lvl <= TOTAL_LEVELS; lvl++) {
        if (getLevelMasteredCount(lvl) < 20) return lvl;
      }
      return TOTAL_LEVELS;
    }

    // =========================================================================
    // --- 3. РЕНДЕР КАРТЫ ---
    // =========================================================================
    function renderMap() {
      const tree = document.getElementById('snakeTree');
      if (!tree) return;
      tree.innerHTML = '<svg id="snakeSvg"></svg>';

      const currentLvl = getCurrentUnlockedLevel();

      if (currentLvl > 1) {
        const masteredTotal = allWords.filter(w => isWordMastered(w.id)).length;
        const wrapRev = document.createElement('div');
        wrapRev.className = `level-node-wrapper pos-0`;
        wrapRev.innerHTML = `
          <div class="level-node review-node" onclick="openReviewMenu()">
            <span style="font-size: 11px; font-weight: 800; margin-top:2px;">Повтор</span>
            <span class="node-progress">${masteredTotal}</span>
          </div>
        `;
        tree.appendChild(wrapRev);
      }

      const currentDone = getLevelMasteredCount(currentLvl);
      const wrapCur = document.createElement('div');
      wrapCur.className = `level-node-wrapper pos-${(currentLvl - 1) % 4}`;
      wrapCur.innerHTML = `
        <div class="level-node active-unlocked" onclick="openLevelModal(${currentLvl})">
          <span class="node-num">${currentLvl}</span>
          <span class="node-progress">${currentDone}</span>
        </div>
      `;
      tree.appendChild(wrapCur);

      for (let lvl = currentLvl + 1; lvl <= TOTAL_LEVELS; lvl++) {
        const wrapLock = document.createElement('div');
        wrapLock.className = `level-node-wrapper pos-${(lvl - 1) % 4}`;
        wrapLock.innerHTML = `
          <div class="level-node locked">
            <span class="node-num">${lvl}</span>
          </div>
        `;
        tree.appendChild(wrapLock);
      }

      requestAnimationFrame(() => {
        drawSnakePath();
      });
    }

    // =========================================================================
    // --- РАСЧЁТ ПУНКТИРНОЙ ТРОПИНКИ (ИДЕАЛЬНОЕ ПОПАДАНИЕ ВО ВСЕ 73 УРОВНЯ) ---
    // =========================================================================
    function drawSnakePath() {
      const svg = document.getElementById('snakeSvg');
      const container = document.getElementById('snakeTree');
      if (!svg || !container) return;

      const wrappers = container.querySelectorAll('.level-node-wrapper');
      if (wrappers.length < 2) return;

      const fullHeight = container.scrollHeight;
      const fullWidth = container.offsetWidth;

      // Жёстко задаём размеры и систему координат холста SVG
      svg.style.width = fullWidth + 'px';
      svg.style.height = fullHeight + 'px';
      svg.setAttribute('width', fullWidth);
      svg.setAttribute('height', fullHeight);
      svg.setAttribute('viewBox', `0 0 ${fullWidth} ${fullHeight}`);
      svg.style.overflow = 'visible';

      const isDesktop = document.body.classList.contains('desktop-device');
      const shiftX = isDesktop ? 120 : 50;
      const centerX = fullWidth / 2;

      const points = [];

      // Берём точные координаты центра каждого кубика без погрешностей экрана
      wrappers.forEach(wrap => {
        const node = wrap.querySelector('.level-node');
        if (!node) return;

        let dx = 0;
        if (wrap.classList.contains('pos-1')) dx = shiftX;
        else if (wrap.classList.contains('pos-3')) dx = -shiftX;

        const x = centerX + dx;
        const y = wrap.offsetTop + node.offsetTop + (node.offsetHeight / 2);
        points.push({ x, y });
      });

      let pathD = '';
      for (let i = 0; i < points.length; i++) {
        if (i === 0) {
          pathD += `M ${points[i].x} ${points[i].y}`;
        } else {
          const p0 = points[i - 1];
          const p1 = points[i];
          const cy = (p0.y + p1.y) / 2;
          pathD += ` C ${p0.x} ${cy}, ${p1.x} ${cy}, ${p1.x} ${p1.y}`;
        }
      }

      svg.innerHTML = `
        <path d="${pathD}" fill="none" stroke="var(--strawberry-deep, #ec6f88)" stroke-width="3.5" stroke-dasharray="8,8" stroke-linecap="round" opacity="0.6" />
      `;
    }

    // =========================================================================
    // --- УПРАВЛЕНИЕ УРОВНЯМИ И ПОВТОРЕНИЕМ (+50 / -50 / ВСЕ) ---
    // =========================================================================
    let activeLevel = 1;
    let isReviewMode = false;
    let reviewLimit = 50; // Комфортный стартовый размер пачки

    function openLevelModal(lvl) {
      activeLevel = lvl;
      isReviewMode = false;
      document.getElementById('modalTitle').innerText = `Уровень ${lvl}`;
      
      const batchSel = document.getElementById('reviewBatchSelector');
      if (batchSel) batchSel.style.display = 'none';

      document.getElementById('modeModal').classList.add('open');
    }

    function openReviewMenu() {
      activeLevel = 1;
      isReviewMode = true;
      document.getElementById('modalTitle').innerText = `Повторение`;

      const totalMastered = allWords.filter(w => isWordMastered(w.id)).length;
      reviewLimit = Math.min(50, totalMastered > 0 ? totalMastered : 50);
      updateReviewLimitUI(totalMastered);

      const batchSel = document.getElementById('reviewBatchSelector');
      if (batchSel) batchSel.style.display = 'flex';

      document.getElementById('modeModal').classList.add('open');
    }

    function adjustReviewLimit(delta) {
      const totalMastered = allWords.filter(w => isWordMastered(w.id)).length;
      if (totalMastered === 0) return;
      reviewLimit = Math.max(10, Math.min(totalMastered, reviewLimit + delta));
      updateReviewLimitUI(totalMastered);
    }

    function setReviewLimitAll() {
      const totalMastered = allWords.filter(w => isWordMastered(w.id)).length;
      reviewLimit = totalMastered;
      updateReviewLimitUI(totalMastered);
    }

    function updateReviewLimitUI(total) {
      const countEl = document.getElementById('reviewCountDisplay');
      const totalEl = document.getElementById('reviewTotalDisplay');
      if (countEl) countEl.innerText = reviewLimit;
      if (totalEl) totalEl.innerText = total;
    }

    function closeModal(e) {
      if (e.target.id === 'modeModal') {
        document.getElementById('modeModal').classList.remove('open');
      }
    }

    function switchView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function showMap() {
      switchView('viewMap');
      renderMap();
    }

    function launchMode(mode) {
      document.getElementById('modeModal').classList.remove('open');
      
      let pool = [];
      if (isReviewMode) {
        const mastered = allWords.filter(w => isWordMastered(w.id));
        // Приоритет словам с меньшим интервалом (которые забываются в первую очередь)
        mastered.sort((a, b) => {
          const srsA = initCardSRS(a.id);
          const srsB = initCardSRS(b.id);
          return (srsA.interval || 0) - (srsB.interval || 0);
        });
        pool = mastered.slice(0, reviewLimit);
      } else {
        const unlearned = getLevelWords(activeLevel).filter(w => !isWordMastered(w.id));
        pool = unlearned.length > 0 ? unlearned : getLevelWords(activeLevel);
      }

      if (pool.length === 0) {
        alert('Пока нет слов для тренировки!');
        return;
      }

      if (mode === 'anki') startAnki(pool);
      else startStackGame(pool);
    }

    // =========================================================================
    // --- 4. ДВИЖОК ANKI ---
    // =========================================================================
    let ankiQueue = [];
    let currentAnkiCard = null;
    let ankiMode = 'ja';
    let ankiTotalBatchSize = 0;
    let ankiGraduatedIds = new Set();

    function setAnkiMode(m) {
      ankiMode = m;
      document.getElementById('btnModeJa').classList.toggle('active', m === 'ja');
      document.getElementById('btnModeRu').classList.toggle('active', m === 'ru');
      if (currentAnkiCard) renderAnkiCard();
    }

    function initCardSRS(wId) {
      const card = getWordData(wId);
      if (card.state === undefined) {
        card.state = card.stacked ? CARD_STATE.REVIEW : CARD_STATE.NEW;
        card.step = 0;
        card.easeFactor = card.easeFactor || ANKI_CONFIG.startingEase;
        card.interval = card.interval || 0;
        card.reps = card.reps || 0;
        card.lapses = card.lapses || 0;
      }
      return card;
    }

  function startAnki(words) {
      ankiGraduatedIds.clear();
      ankiTotalBatchSize = words.length;

      // Заполняем шкалу только для обычных уровней (1..73).
      // В режиме повторения шкала всегда стартует с 0!
      if (!isReviewMode) {
        words.forEach(w => {
          const srs = initCardSRS(w.id);
          if (srs.state === CARD_STATE.REVIEW && srs.interval >= 1) {
            ankiGraduatedIds.add(w.id);
          }
        });
      }

      if (isReviewMode) {
        ankiQueue = [...words].sort((a, b) => {
          const srsA = initCardSRS(a.id);
          const srsB = initCardSRS(b.id);
          return (srsA.interval || 0) - (srsB.interval || 0);
        });
      } else {
        ankiQueue = [...words].sort(() => Math.random() - 0.5);
      }

      switchView('viewAnki');
      nextAnkiCard();
    }

    function nextAnkiCard() {
      if (ankiQueue.length === 0) {
        saveState();
        setTimeout(() => {
          alert('🎉 Сессия Anki успешно завершена!');
          showMap();
        }, 200);
        return;
      }

      currentAnkiCard = ankiQueue.shift();
      renderAnkiCard();
    }

    function renderAnkiCard() {
      const w = currentAnkiCard;
      const srs = initCardSRS(w.id);

      const qEl = document.getElementById('ankiQuestion');
      const ansBlock = document.getElementById('ankiAnswerBlock');
      const readingEl = document.getElementById('ankiReading');
      const transEl = document.getElementById('ankiTranslation');
      const readingRow = document.querySelector('.card-reading-row');

      // Сбрасываем кнопки
      document.getElementById('btnShowAnswer').style.display = 'block';
      document.getElementById('ankiGradeGroup').style.display = 'none';

      // Бейдж состояния SRS
      const badge = document.getElementById('ankiCardBadge');
      if (srs.state === CARD_STATE.NEW) {
        badge.innerText = 'Новое';
        badge.style.background = 'var(--cream)';
        badge.style.color = 'var(--ink-soft)';
      } else if (srs.state === CARD_STATE.LEARNING) {
        badge.innerText = `Шаг ${srs.step + 1}/${ANKI_CONFIG.learningSteps.length}`;
        badge.style.background = 'var(--peach)';
        badge.style.color = 'var(--peach-deep)';
      } else if (srs.state === CARD_STATE.RELEARNING) {
        badge.innerText = 'Повтор';
        badge.style.background = 'var(--danger-bg)';
        badge.style.color = 'var(--danger-text)';
      } else {
        badge.innerText = `Интервал: ${srs.interval}д`;
        badge.style.background = '#eef7eb';
        badge.style.color = 'var(--matcha-deep)';
      }

      // Всегда распределяем японский и русский по своим постоянным местам
      const mainJapaneseText = w.kanji !== '—' ? w.kanji : w.reading;
      qEl.innerText = mainJapaneseText;
      readingEl.innerText = (w.kanji !== '—' ? w.reading : '');
      transEl.innerText = w.translation;

      // Размер шрифта для Кандзи
      const len = mainJapaneseText.length;
      if (len <= 2) {
        qEl.style.fontSize = 'clamp(4.8rem, 20vw, 7.5rem)';
      } else if (len <= 4) {
        qEl.style.fontSize = 'clamp(3.6rem, 14vw, 5.4rem)';
      } else if (len <= 7) {
        qEl.style.fontSize = 'clamp(2.6rem, 10vw, 4.0rem)';
      } else if (len <= 11) {
        qEl.style.fontSize = 'clamp(2.0rem, 7.5vw, 3.0rem)';
      } else {
        qEl.style.fontSize = 'clamp(1.5rem, 5.5vw, 2.2rem)';
      }

      // Настройка видимости ДО нажатия «Показать ответ»
      if (ankiMode === 'ja') {
        // Режим 🇯🇵: Сверху видно кандзи, снизу блок ответа скрыт
        qEl.style.visibility = 'visible';
        ansBlock.classList.remove('revealed');
        if (readingRow) readingRow.style.visibility = 'visible';
      } else {
        // Режим 🇷🇺: Сверху белое место (кандзи скрыто), снизу виден только русский перевод
        qEl.style.visibility = 'hidden';
        ansBlock.classList.add('revealed');
        if (readingRow) readingRow.style.visibility = 'hidden'; // чтение и звук скрыты до клика
      }

      // Прогресс сессии
      const graduatedCount = ankiGraduatedIds.size;
      const pct = ankiTotalBatchSize > 0 ? (graduatedCount / ankiTotalBatchSize) * 100 : 0;
      document.getElementById('ankiProgress').style.width = `${pct}%`;
      document.getElementById('ankiCounter').innerText = `${graduatedCount}/${ankiTotalBatchSize}`;

      // Предзагрузка аудио
      if (currentAnkiCard) {
        preloadCurrentAudio(currentAnkiCard.id);
      }
      if (ankiQueue.length > 0) {
        preloadWordAudio(ankiQueue[0].id);
      }
    }

    function revealAnkiAnswer() {
      const qEl = document.getElementById('ankiQuestion');
      const ansBlock = document.getElementById('ankiAnswerBlock');
      const readingRow = document.querySelector('.card-reading-row');

      // Показываем всё, что было скрыто
      ansBlock.classList.add('revealed');
      qEl.style.visibility = 'visible';
      if (readingRow) readingRow.style.visibility = 'visible';

      document.getElementById('btnShowAnswer').style.display = 'none';
      document.getElementById('ankiGradeGroup').style.display = 'grid';
      speakCurrentWord();
    }

    function speakCurrentWord() {
      if (currentAnkiCard) speakKyoko(currentAnkiCard.id);
    }

    function handleAnkiGrade(grade) {
      const w = currentAnkiCard;
      const srs = initCardSRS(w.id);
      const now = Date.now();

      srs.reps = (srs.reps || 0) + 1;

      if (grade === 1) {
        srs.lapses = (srs.lapses || 0) + 1;
        srs.easeFactor = Math.max(ANKI_CONFIG.minEase, srs.easeFactor - 0.20);
        srs.state = CARD_STATE.LEARNING;
        srs.step = 0;
        srs.interval = 0;
        srs.dueDate = now;
        ankiGraduatedIds.delete(w.id);

        const pos = Math.min(ankiQueue.length, 1 + Math.floor(Math.random() * 2));
        ankiQueue.splice(pos, 0, w);
      } else if (grade === 2) {
        srs.easeFactor = Math.max(ANKI_CONFIG.minEase, srs.easeFactor - 0.15);
        if (srs.state === CARD_STATE.REVIEW) {
          srs.interval = Math.max(1, Math.round(srs.interval * ANKI_CONFIG.hardIntervalFactor));
          srs.dueDate = now + (srs.interval * 86400000);
          srs.ankiMastered = true;
          ankiGraduatedIds.add(w.id);
        } else {
          const pos = Math.min(ankiQueue.length, 3 + Math.floor(Math.random() * 2));
          ankiQueue.splice(pos, 0, w);
        }
      } else if (grade === 3) {
        if (srs.state === CARD_STATE.REVIEW) {
          srs.interval = Math.max(srs.interval + 1, Math.round(srs.interval * srs.easeFactor));
          srs.dueDate = now + (srs.interval * 86400000);
          srs.ankiMastered = true;
          ankiGraduatedIds.add(w.id);
        } else {
          const nextStep = (srs.step || 0) + 1;
          if (nextStep >= ANKI_CONFIG.learningSteps.length) {
            srs.state = CARD_STATE.REVIEW;
            srs.step = 0;
            srs.interval = ANKI_CONFIG.graduatingInterval;
            srs.dueDate = now + (srs.interval * 86400000);
            srs.ankiMastered = true;
            ankiGraduatedIds.add(w.id);
          } else {
            srs.state = CARD_STATE.LEARNING;
            srs.step = nextStep;
            const pos = Math.min(ankiQueue.length, 5 + Math.floor(Math.random() * 2));
            ankiQueue.splice(pos, 0, w);
          }
        }
      } else if (grade === 4) {
        srs.easeFactor = srs.easeFactor + 0.15;
        if (srs.state === CARD_STATE.REVIEW) {
          srs.interval = Math.max(srs.interval + 2, Math.round(srs.interval * srs.easeFactor * ANKI_CONFIG.easyBonus));
        } else {
          srs.interval = ANKI_CONFIG.easyInterval;
        }
        srs.state = CARD_STATE.REVIEW;
        srs.step = 0;
        srs.dueDate = now + (srs.interval * 86400000);
        srs.ankiMastered = true;
        ankiGraduatedIds.add(w.id);
      }

      saveState();
      nextAnkiCard();
    }

    // =========================================================================
    // --- 5. ИГРА «СТОПКА» ---
    // =========================================================================
    let stackWaves = [];
    let currentWaveIndex = 0;
    let boardSlots = new Array(12).fill(null);
    let selectedSlotIdx = null;
    let stackTotalWords = 0;
    let stackDoneWords = 0;

    function getWordComponents(word) {
      const list = [];
      if (word.kanji && word.kanji !== '—') {
        list.push({ wordId: word.id, type: 'kanji', text: word.kanji });
      }
      list.push({ wordId: word.id, type: 'reading', text: word.reading });
      list.push({ wordId: word.id, type: 'translation', text: word.translation });

      return {
        wordId: word.id,
        totalNeeded: list.length,
        items: list
      };
    }

    function startStackGame(words) {
      stackTotalWords = words.length;
      stackDoneWords = 0;
      stackWaves = [];
      currentWaveIndex = 0;
      selectedSlotIdx = null;

      let currentWavePieces = [];
      const shuffledWords = [...words].sort(() => Math.random() - 0.5);

      shuffledWords.forEach(w => {
        const def = getWordComponents(w);
        const pieces = def.items.map(it => ({
          wordId: def.wordId,
          totalNeeded: def.totalNeeded,
          items: [it]
        }));

        if (currentWavePieces.length + pieces.length > 12) {
          stackWaves.push(currentWavePieces);
          currentWavePieces = [];
        }
        currentWavePieces.push(...pieces);
      });

      if (currentWavePieces.length > 0) {
        stackWaves.push(currentWavePieces);
      }

      switchView('viewStack');
      loadWave(0);
      updateStackProgress();
    }

    function loadWave(waveIdx) {
      currentWaveIndex = waveIdx;
      selectedSlotIdx = null;
      boardSlots = new Array(12).fill(null);

      if (waveIdx < stackWaves.length) {
        const wavePieces = [...stackWaves[waveIdx]].sort(() => Math.random() - 0.5);
        for (let i = 0; i < wavePieces.length; i++) {
          boardSlots[i] = wavePieces[i];
        }
      }

      renderStackBoard();
    }

    function updateStackProgress() {
      const pct = stackTotalWords > 0 ? (stackDoneWords / stackTotalWords) * 100 : 0;
      document.getElementById('stackProgress').style.width = `${pct}%`;
      document.getElementById('stackCounter').innerText = `${stackDoneWords}/${stackTotalWords}`;
    }

    function renderStackBoard() {
      const grid = document.getElementById('stackGrid');
      if (!grid) return;
      grid.innerHTML = '';

      boardSlots.forEach((stack, idx) => {
        const el = document.createElement('div');
        el.className = 'stack-tile';
        el.dataset.slot = idx;

        if (!stack) {
          el.classList.add('empty-slot');
          grid.appendChild(el);
          return;
        }

        if (selectedSlotIdx === idx) el.classList.add('selected');

        const isStack = stack.items.length > 1;
        const mainItem = stack.items[stack.items.length - 1];

        const textLen = mainItem.text.length;
        let sizeClass = '';

        if (mainItem.type === 'translation') {
          if (textLen > 24) sizeClass = 'size-xs';
          else if (textLen > 14) sizeClass = 'size-sm';
        } else if (mainItem.type === 'reading') {
          if (textLen > 10) sizeClass = 'size-xs';
          else if (textLen > 7) sizeClass = 'size-sm';
        } else if (mainItem.type === 'kanji') {
          if (textLen > 6) sizeClass = 'size-sm';
        }

        let chipsHtml = '';
        if (isStack) {
          chipsHtml = `<div class="tile-sub-chips">` + 
            stack.items.slice(0, -1).map(it => `<span class="chip-item">${it.text}</span>`).join('') +
            `</div>`;
        }

        el.innerHTML = `
          <div class="tile-counter-badge">${stack.items.length}/${stack.totalNeeded}</div>
          <div class="tile-main-text type-${mainItem.type} ${sizeClass}">${mainItem.text}</div>
          ${chipsHtml}
        `;

        el.onclick = () => onSlotClick(idx, el);
        grid.appendChild(el);
      });
    }

    function onSlotClick(clickedIdx, el) {
      if (!boardSlots[clickedIdx]) return;

      // 1. Первый клик (выбор карточки)
      if (selectedSlotIdx === null) {
        selectedSlotIdx = clickedIdx;
        renderStackBoard();
        return;
      }

      // 2. Клик по уже выбранной карточке/стопке (снятие выделения)
      if (selectedSlotIdx === clickedIdx) {
        selectedSlotIdx = null;
        renderStackBoard();
        return;
      }

      // 3. Второй клик (попытка объединения)
      const firstIdx = selectedSlotIdx;
      const targetIdx = clickedIdx;

      const firstStack = boardSlots[firstIdx];
      const targetStack = boardSlots[targetIdx];

      if (!firstStack || !targetStack) {
        selectedSlotIdx = null;
        renderStackBoard();
        return;
      }

      // Проверка совпадения
      if (firstStack.wordId === targetStack.wordId) {
        targetStack.items.push(...firstStack.items);
        boardSlots[firstIdx] = null;

        if (targetStack.wordId) speakKyoko(targetStack.wordId);

        // Если стопка собрана ПОЛНОСТЬЮ
        if (targetStack.items.length >= targetStack.totalNeeded) {
          selectedSlotIdx = null;
          const p = getWordData(targetStack.wordId);
          p.stacked = true;
          saveState();
          stackDoneWords++;
          updateStackProgress();

          renderStackBoard();
          const targetEl = document.querySelector(`.stack-tile[data-slot="${targetIdx}"]`);
          if (targetEl) targetEl.classList.add('completed-burst');

          setTimeout(() => {
            boardSlots[targetIdx] = null;
            renderStackBoard();

            const isWaveCleared = boardSlots.every(s => s === null);
            if (isWaveCleared) {
              if (currentWaveIndex + 1 < stackWaves.length) {
                setTimeout(() => {
                  loadWave(currentWaveIndex + 1);
                }, 200);
              } else {
                setTimeout(() => {
                  alert('🎉 Превосходно! Все стопки собраны!');
                  showMap();
                }, 300);
              }
            }
          }, 300);
        } else {
          // Если стопка собрана НЕ ДО КОНЦА (например, 2 из 3) — оставляем ее активной
          selectedSlotIdx = targetIdx;
          renderStackBoard();
          const targetEl = document.querySelector(`.stack-tile[data-slot="${targetIdx}"]`);
          if (targetEl) targetEl.classList.add('merge-pulse');
        }
      } else {
        // Ошибка (карточки не подошли друг к другу)
        const firstEl = document.querySelector(`.stack-tile[data-slot="${firstIdx}"]`);
        const secondEl = el;

        if (firstEl) firstEl.classList.add('error');
        if (secondEl) secondEl.classList.add('error');

        selectedSlotIdx = null;
        setTimeout(() => {
          renderStackBoard();
        }, 320);
      }
    }

    // =========================================================================
    // --- 6. СТАРТ ПРИЛОЖЕНИЯ ---
    // =========================================================================
    updateSoundBtnUI();
    loadState();
  </script>
</body>
</html>
