<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Не/переходные глаголы (N4/N5)</title>

  <!-- Google Fonts: Японский округлый шрифт -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Применение темы, сохранённой в главном меню -->
  <script>
    const savedTheme = localStorage.getItem('app_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      const themeColor = savedTheme === 'dark' ? '#181517' : '#fbf8ee';
      if (tg.setHeaderColor) tg.setHeaderColor(themeColor);
      if (tg.setBackgroundColor) tg.setBackgroundColor(themeColor);
    }
  </script>

  <style>
    /* ================= СВЕТЛАЯ ТЕМА ================= */
    :root {
      --cream: #fbf8ee;
      --paper: #ffffff;
      --ink: #4a3a36;
      --ink-soft: #8f8478;

      --strawberry: #ffc4d0;
      --strawberry-deep: #ec6f88;
      --strawberry-shadow: #af3952;

      --matcha: #d5e8b3;
      --matcha-deep: #8db55a;
      --matcha-shadow: #58792c;

      --peach: #ffd8bb;
      --peach-deep: #f0a06c;
      --peach-shadow: #b35f29;

      --pistachio: #cdeec4;
      --pistachio-deep: #78bf74;

      --apricot: #ffe6cc;
      --line: #f3e2d6;

      --icon-box-strawberry: #fff0f3;
      --icon-box-peach: #fff5ec;
      --icon-box-matcha: #f3f9e8;

      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    /* ================= ТЁМНАЯ ТЕМА ================= */
    [data-theme="dark"] {
      --cream: #181517;
      --paper: #231e22;
      --ink: #fdfaf6;
      --ink-soft: #a89ca0;

      --strawberry: #4e2933;
      --strawberry-deep: #ff7593;
      --strawberry-shadow: #943248;

      --matcha: #2e3b22;
      --matcha-deep: #9dcd60;
      --matcha-shadow: #4d6d24;

      --peach: #4d3324;
      --peach-deep: #f8a068;
      --peach-shadow: #a44f20;

      --apricot: #3d2a20;
      --line: #332b30;

      --icon-box-strawberry: #341e25;
      --icon-box-peach: #38251c;
      --icon-box-matcha: #232d1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--cream);
      color: var(--ink);
      font-family: 'M PLUS Rounded 1c', 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: calc(65px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px));
      transition: background-color 0.25s ease, color 0.25s ease, padding-top 0.2s ease;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(255, 196, 208, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(213, 232, 179, 0.25) 0%, transparent 40%);
      background-attachment: fixed;
      position: relative;
    }

    [data-theme="dark"] body {
      background-image:
        radial-gradient(circle at 15% 15%, rgba(236, 111, 136, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(141, 181, 90, 0.10) 0%, transparent 45%);
    }

    body.tg-fullscreen {
      padding-top: calc(85px + env(safe-area-inset-top, 0px)) !important;
    }

    /* Фоновые лепестки сакуры */
    .petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .petals span {
      position: absolute;
      top: -30px;
      width: 14px;
      height: 11px;
      background: var(--strawberry-deep);
      border-radius: 80% 0 80% 0;
      opacity: .5;
      animation: fall 14s linear infinite;
    }
    .petals span:nth-child(1) { left: 8%;  animation-delay: 0s;   animation-duration: 15s; }
    .petals span:nth-child(2) { left: 24%; animation-delay: -5s;  animation-duration: 18s; width: 10px; height: 8px; }
    .petals span:nth-child(3) { left: 42%; animation-delay: -9s;  animation-duration: 16s; background: var(--peach-deep); }
    .petals span:nth-child(4) { left: 61%; animation-delay: -3s;  animation-duration: 20s; width: 12px; height: 9px; }
    .petals span:nth-child(5) { left: 78%; animation-delay: -11s; animation-duration: 17s; background: var(--matcha-deep); }
    .petals span:nth-child(6) { left: 92%; animation-delay: -7s;  animation-duration: 19s; }

    @keyframes fall {
      0%   { transform: translate(0, 0) rotate(0deg); }
      50%  { transform: translate(28px, 55vh) rotate(180deg); }
      100% { transform: translate(-12px, 110vh) rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .petals { display: none; }
    }

    #app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    /* Верхняя панель (только кнопка Меню) */
    .top-bar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 2px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--paper);
      color: var(--ink);
      border: 2px solid var(--line);
      font-size: 13px;
      font-weight: 800;
      padding: 7px 16px;
      border-radius: 99px;
      box-shadow: 0 3px 0 var(--line);
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .nav-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--line);
    }

    /* Навигация по Уровням (1, 2, 3, 4, 5 + Ошибки) */
    .level-nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr) 2.2fr;
      gap: 5px;
      width: 100%;
    }

    .lvl-btn {
      padding: 9px 2px;
      border-radius: var(--radius-md);
      border: 2px solid var(--line);
      background: var(--paper);
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-shadow: 0 3px 0 var(--line);
      font-family: inherit;
      min-width: 0;
    }
    .lvl-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--line);
    }
    .lvl-btn.active {
      background: var(--peach-deep);
      color: #ffffff;
      border-color: var(--peach-deep);
      box-shadow: 0 3px 0 var(--peach-shadow);
    }

    .lvl-btn.errors-btn {
      color: var(--strawberry-deep);
      border-color: var(--strawberry);
      box-shadow: 0 3px 0 var(--strawberry);
      padding: 9px 4px;
    }
    .lvl-btn.errors-btn.active {
      background: var(--strawberry-deep);
      color: #ffffff;
      border-color: var(--strawberry-deep);
      box-shadow: 0 3px 0 var(--strawberry-shadow);
    }

    /* Баннер секретов/правил */
    .theory-banner {
      background: var(--paper);
      border: 2px dashed var(--peach-deep);
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--peach-deep);
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(240, 160, 108, 0.25);
      transition: all 0.15s ease;
    }
    .theory-banner:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(240, 160, 108, 0.25);
    }

    /* Прогресс-бар с карамельной полоской */
    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--ink-soft);
      font-weight: 700;
      padding: 0 4px;
    }
    .progress-container {
      width: 100%;
      height: 10px;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
      padding: 1px;
    }

    /* Карамельная полоса */
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      transition: width 0.25s ease;
      background: repeating-linear-gradient(135deg, var(--strawberry-deep) 0 10px, var(--strawberry) 10px 20px);
    }
    [data-theme="dark"] .progress-fill {
      background: repeating-linear-gradient(135deg, var(--strawberry-deep) 0 10px, #3d1c25 10px 20px);
    }

    /* Карточка вопроса */
    .card {
      position: relative;
      background: var(--paper);
      border: 2.5px solid var(--peach);
      box-shadow: 0 6px 0 var(--peach);
      border-radius: var(--radius-xl);
      padding: 24px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      transition: background 0.25s ease;
    }

    .btn-sound-corner {
      position: absolute;
      top: 14px;
      right: 14px;
    }

    .target-header {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0 36px;
    }

    /* Кандзи в вопросе: строго 500 */
    .target-phrase {
      font-size: 28px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.5px;
      line-height: 1.3;
    }

    .target-particle {
      color: var(--strawberry-deep);
      font-weight: 700;
    }

    .target-blank {
      color: var(--peach-deep);
      border-bottom: 3px dashed var(--peach-deep);
      padding: 0 6px;
      display: inline-block;
    }

    .target-reading {
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-soft);
      letter-spacing: 0.5px;
      min-height: 22px;
    }

    .target-ru {
      font-size: 15px;
      font-weight: 700;
      color: var(--matcha-deep);
      line-height: 1.35;
      margin-top: 2px;
    }

    /* Кнопка звука */
    .btn-sound {
      background: var(--cream);
      border: 2px solid var(--line);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 2px 0 var(--line);
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-sound:active {
      transform: translateY(2px);
      box-shadow: 0 0 0 var(--line);
    }

    /* Сетка вариантов ответа */
    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .choice-btn {
      background: var(--paper);
      border: 2.5px solid var(--line);
      box-shadow: 0 5px 0 var(--line);
      border-radius: var(--radius-lg);
      padding: 16px 8px;
      cursor: pointer;
      transition: all 0.12s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-align: center;
      word-break: keep-all;
      font-family: inherit;
    }
    .choice-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--line);
      border-color: var(--peach-deep);
    }

    /* Кандзи в кнопках: 500 */
    .choice-main {
      font-size: 19px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.25;
    }

    .choice-sub {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-soft);
    }

    /* Блок пояснения */
    .feedback-box {
      background: var(--paper);
      border-radius: var(--radius-xl);
      padding: 18px;
      display: none;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s ease;
    }
    .feedback-box.correct {
      border: 2.5px solid var(--matcha);
      box-shadow: 0 6px 0 var(--matcha);
      background: var(--icon-box-matcha);
    }
    .feedback-box.wrong {
      border: 2.5px solid var(--strawberry);
      box-shadow: 0 6px 0 var(--strawberry);
      background: var(--icon-box-strawberry);
    }

    .fb-title {
      font-size: 14.5px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .feedback-box.correct .fb-title { color: var(--matcha-deep); }
    .feedback-box.wrong .fb-title { color: var(--strawberry-deep); }

    .fb-body-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* Кандзи в ответе: 500 */
    .fb-full {
      font-size: 24px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.25;
    }
    .fb-kana {
      font-size: 14px;
      color: var(--ink-soft);
      font-weight: 500;
    }

    /* Блок пояснения — обычный шрифт (400) + персиковые акценты */
    .fb-rule {
      font-size: 13.5px;
      color: var(--ink);
      line-height: 1.6;
      background: var(--paper);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--line);
      font-weight: 400;
    }
    .fb-rule b,
    .fb-rule strong {
      color: var(--peach-deep);
      font-weight: 700;
    }
    .fb-step-line {
      margin-bottom: 6px;
    }
    .fb-step-line:last-child {
      margin-bottom: 0;
    }

    /* Основная кнопка действия */
    .btn-action {
      background: var(--strawberry-deep);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--strawberry-shadow);
      transition: all 0.12s ease;
      font-family: inherit;
      width: 100%;
    }
    .btn-action:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--strawberry-shadow);
    }

    /* Модальное окно теории */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 12, 14, 0.65);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .modal-backdrop.show {
      display: flex;
      opacity: 1;
    }

    .modal-card {
      background: var(--paper);
      border: 3px solid var(--line);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 14px;
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }
    .modal-backdrop.show .modal-card {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px dashed var(--line);
      padding-bottom: 12px;
    }
    .modal-icon {
      font-size: 28px;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--ink);
      margin: 0;
    }

    /* Тело модалки "Секреты пар" */
    .modal-body {
      font-size: 14px;
      line-height: 1.65;
      color: var(--ink);
      font-weight: 400;
    }
    .modal-body strong {
      font-weight: 600;
      color: var(--ink);
    }
    .modal-body p > strong:first-child {
      color: var(--peach-deep);
      font-weight: 700;
      display: inline-block;
      margin-bottom: 3px;
    }
    .modal-body code {
      background: var(--cream);
      padding: 1px 5px;
      border-radius: 6px;
      font-family: inherit;
      color: var(--strawberry-deep);
      font-weight: 500;
      border: 1px solid var(--line);
    }

    .modal-close-btn {
      background: var(--peach-deep);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--peach-shadow);
      font-family: inherit;
      transition: all 0.12s ease;
    }
    .modal-close-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--peach-shadow);
    }

    /* Экран завершения */
    .dialog-view {
      background: var(--paper);
      border: 2.5px solid var(--matcha);
      box-shadow: 0 6px 0 var(--matcha);
      border-radius: var(--radius-xl);
      padding: 36px 20px;
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .dialog-view h3 {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
    }
    .dialog-view p {
      font-size: 14.5px;
      color: var(--ink-soft);
      font-weight: 600;
    }
  </style>
</head>
<body>

<!-- Падающие лепестки сакуры -->
<div class="petals" aria-hidden="true">
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
</div>

<div id="app">
  <!-- Верхняя строка (только кнопка Меню) -->
  <div class="top-bar">
    <a href="index.html" class="nav-btn">← Меню</a>
  </div>

  <!-- 1. Навигация по Уровням (1, 2, 3, 4, 5 + Ошибки) -->
  <div class="level-nav">
    <button type="button" class="lvl-btn active" id="lvlBtn1" onclick="switchLevel(1)" title="Прошедшее">1</button>
    <button type="button" class="lvl-btn" id="lvlBtn2" onclick="switchLevel(2)" title="Настоящее">2</button>
    <button type="button" class="lvl-btn" id="lvlBtn3" onclick="switchLevel(3)" title="〜ている">3</button>
    <button type="button" class="lvl-btn" id="lvlBtn4" onclick="switchLevel(4)" title="Микс">4</button>
    <button type="button" class="lvl-btn" id="lvlBtn5" onclick="switchLevel(5)" title="が или を?">5</button>
    <button type="button" class="lvl-btn errors-btn" id="lvlBtnErr" onclick="switchLevel('errors')">Ошибки (0)</button>
  </div>

  <!-- 2. Баннер правил -->
  <div class="theory-banner" onclick="openTheory()">
    <span>📖</span> Секреты пар 自動詞 / 他動詞
  </div>

  <!-- 3. Прогресс -->
  <div class="progress-wrap">
    <div class="progress-labels">
      <span id="progCountLabel">Вопрос 1</span>
      <span id="progPctLabel">0%</span>
    </div>
    <div class="progress-container">
      <div class="progress-fill" id="progressBar"></div>
    </div>
  </div>

  <!-- 4. Игровая панель -->
  <div id="gamePanel" style="display: flex; flex-direction: column; gap: 12px;">
    <div class="card">
      <button type="button" class="btn-sound btn-sound-corner" onclick="replayQuestionAudio()" title="Послушать">🔊</button>

      <!-- КРУПНО: кандзи 500 -->
      <div class="target-header">
        <div class="target-phrase" id="qPhrase">ドアが ＿＿</div>
      </div>
      <!-- СРЕДНЕ: чтение -->
      <div class="target-reading" id="qReading">どあが ＿＿</div>
      <!-- Перевод -->
      <div class="target-ru" id="qRu">дверь открылась</div>
    </div>

    <!-- 2 кнопки ответов строчкой -->
    <div class="buttons-grid" id="choicesGrid"></div>

    <!-- Пояснение ответа -->
    <div class="feedback-box" id="feedbackBox">
      <div class="fb-title">
        <span id="fbVerdict">Верно!</span>
        <span id="fbTypeTag">自動詞 (непереходный)</span>
      </div>
      <div class="fb-body-wrap">
        <div>
          <!-- Кандзи 500 -->
          <div class="fb-full" id="fbFull">ドアが 開いた</div>
          <div class="fb-kana" id="fbKana">どあがあいた</div>
        </div>
        <button type="button" class="btn-sound" onclick="replayAnswerAudio()" title="Послушать правильный ответ">🔊</button>
      </div>
      <div class="fb-rule" id="fbRule"></div>
      <button type="button" class="btn-action" id="btnNext" onclick="nextQuestion()">Дальше →</button>
    </div>
  </div>

  <!-- Экран окончания списка -->
  <div class="dialog-view" id="emptyScreen">
    <div style="font-size: 38px;">🎉</div>
    <h3 id="emptyTitle">Уровень завершён!</h3>
    <p id="emptyDesc">Все пары успешно отработаны!</p>
    <button type="button" class="btn-action" style="max-width: 220px;" onclick="restartLevel()">Пройти заново</button>

function getVerbForms(k, r) {
  var presK = k, presR = r;
  var pastK = "", pastR = "";
  var teK = "", teR = "";

  if (r.endsWith("く")) {
    pastK = k.slice(0, -1) + "いた"; pastR = r.slice(0, -1) + "いた";
    teK = k.slice(0, -1) + "いている"; teR = r.slice(0, -1) + "いている";
  } else if (r.endsWith("す")) {
    pastK = k.slice(0, -1) + "した"; pastR = r.slice(0, -1) + "した";
    teK = k.slice(0, -1) + "している"; teR = r.slice(0, -1) + "している";
  } else if (r.endsWith("む") || r.endsWith("ぶ") || r.endsWith("ぬ")) {
    pastK = k.slice(0, -1) + "んだ"; pastR = r.slice(0, -1) + "んだ";
    teK = k.slice(0, -1) + "んでいる"; teR = r.slice(0, -1) + "んでいる";
  } else if (r.endsWith("る")) {
    var isIchidan = (r.endsWith("える") || r.endsWith("いる") || r.endsWith("れる") || r.endsWith("ねる") || r.endsWith("せる") || r.endsWith("める") || r.endsWith("ける")) && k !== "入る" && k !== "切る" && k !== "減る";
    if (isIchidan) {
      pastK = k.slice(0, -1) + "た"; pastR = r.slice(0, -1) + "た";
      teK = k.slice(0, -1) + "ている"; teR = r.slice(0, -1) + "ている";
    } else {
      pastK = k.slice(0, -1) + "った"; pastR = r.slice(0, -1) + "った";
      teK = k.slice(0, -1) + "っている"; teR = r.slice(0, -1) + "っている";
    }
  }

  return { presK: presK, presR: presR, pastK: pastK, pastR: pastR, teK: teK, teR: teR };
}

  jaVoice = voices.find(function(v) { 
    return (v.lang === 'ja-JP' || v.lang === 'ja_JP' || v.lang.indexOf('ja') === 0) && 
           (v.name.toLowerCase().indexOf('kyoko') !== -1 || v.name.indexOf('Google 日本語') !== -1 || v.name.indexOf('Siri') !== -1);
  }) || voices.find(function(v) { 
    return v.lang === 'ja-JP' || v.lang === 'ja_JP' || v.lang.indexOf('ja') === 0; 
  }) || null;
}
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = initVoices;
  initVoices();
}
function speak(text) {
  if (!('speechSynthesis' in window) || !text) return;
  try {
    window.speechSynthesis.cancel();
    var msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'ja-JP';
    msg.rate = 0.88;
    if (jaVoice) msg.voice = jaVoice;
    window.speechSynthesis.speak(msg);
  } catch (e) {}
}

function shuffleArray(arr) {
  var copy = arr.slice();
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = copy[i];
    copy[i] = copy[j];
    copy[j] = temp;
  }
  return copy;
}

/* ==========================================================================
   ГЕНЕРАТОР ЗАДАНИЙ (Матча 🍵 и Клубника 🍓)
   ========================================================================== */
function generateLevelDeck(level) {
  var deck = [];

  PAIRS_RAW.forEach(function(item) {
    var jForms = getVerbForms(item.ji, item.jr);
    var tForms = getVerbForms(item.ta, item.tr);

    function makeTask(isJi, formType, isParticleChoice) {
      var part = isJi ? "が" : "を";
      var correctForms = isJi ? jForms : tForms;
      var wrongForms   = isJi ? tForms : jForms;

      var targetK = "", targetR = "", wrongK = "", wrongR = "";
      var ruContext = "";

      if (formType === "past") {
        targetK = correctForms.pastK; targetR = correctForms.pastR;
        wrongK  = wrongForms.pastK;   wrongR  = wrongForms.pastR;
        ruContext = isJi ? item.past[0] : item.past[1];
      } else if (formType === "pres") {
        targetK = correctForms.presK; targetR = correctForms.presR;
        wrongK  = wrongForms.presK;   wrongR  = wrongForms.presR;
        ruContext = isJi ? item.pres[0] : item.pres[1];
      } else { // te-iru
        targetK = correctForms.teK; targetR = correctForms.teR;
        wrongK  = wrongForms.teK;   wrongR  = wrongForms.teR;
        ruContext = isJi ? item.te[0] : item.te[1];
      }

      var ruleHtml = `
        <div class="fb-step-line"><b>Частица:</b> <code>${part}</code> указывает на <b>${isJi ? "自動詞 (непереходный — происходит само)" : "他動詞 (переходный — действие человека)"}</b>.</div>
        <div class="fb-step-line"><b>Лайфхак:</b> ${item.tip}</div>
        <div class="fb-step-line" style="margin-top: 6px; padding-top: 6px; border-top: 1.5px dashed var(--line);">
          🍵 <b>${item.nk}が ${item.ji}</b> — ${item.pres[0]} (само)<br>
          🍓 <b>${item.nk}を ${item.ta}</b> — ${item.pres[1]} (человек)
        </div>
      `;

      if (isParticleChoice) {
        return {
          rawId: `${item.ji}_${part}_particle`,
          promptVoice: `${item.nr}`,
          voiceText: `${item.nr}${part} ${targetR}`,
          phraseHtml: `${item.nk}<span class="target-blank">＿</span> ${targetK}`,
          readingText: `${item.nr}＿ ${targetR}`,
          ru: ruContext,
          choices: [
            { main: "が", sub: "" },
            { main: "を", sub: "" }
          ],
          correct: part,
          full: `${item.nk}${part} ${targetK}`,
          kana: `${item.nr}${part}${targetR}`,
          rule: ruleHtml,
          typeTag: isJi ? "自動詞 (непереходный)" : "他動詞 (переходный)"
        };
      }

      return {
        rawId: `${item.ji}_${part}_${formType}`,
        promptVoice: `${item.nr}${part}`,
        voiceText: `${item.nr}${part} ${targetR}`,
        phraseHtml: `${item.nk}<span class="target-particle">${part}</span> <span class="target-blank">＿＿</span>`,
        readingText: `${item.nr}${part} ＿＿`,
        ru: ruContext,
        choices: shuffleArray([
          { main: targetK, sub: targetR },
          { main: wrongK, sub: wrongR }
        ]),
        correct: targetK,
        full: `${item.nk}${part} ${targetK}`,
        kana: `${item.nr}${part}${targetR}`,
        rule: ruleHtml,
        typeTag: isJi ? "自動詞 (непереходный)" : "他動詞 (переходный)"
      };
    }

    if (level === 1) {
      deck.push(makeTask(true, "past", false));
      deck.push(makeTask(false, "past", false));
    } else if (level === 2) {
      deck.push(makeTask(true, "pres", false));
      deck.push(makeTask(false, "pres", false));
    } else if (level === 3) {
      deck.push(makeTask(true, "te", false));
      deck.push(makeTask(false, "te", false));
    } else if (level === 4) {
      var f = ["past", "pres", "te"][Math.floor(Math.random() * 3)];
      deck.push(makeTask(true, f, false));
      deck.push(makeTask(false, f, false));
    } else if (level === 5) {
      deck.push(makeTask(true, "past", true));
      deck.push(makeTask(false, "past", true));
    }
  });

  return shuffleArray(deck);
}

/* ==========================================================================
   УПРАВЛЕНИЕ ИГРОЙ
   ========================================================================== */
var currentLevel = 1;
var currentIndex = 0;
var currentList = [];
var errorList = [];
var isAnswered = false;

function initLevel() {
  if (currentLevel === 'errors') {
    currentList = errorList.slice();
  } else {
    currentList = generateLevelDeck(currentLevel);
  }
  currentIndex = 0;
  renderCard();
}

function renderCard() {
  isAnswered = false;
  document.getElementById('feedbackBox').style.display = 'none';
  document.getElementById('emptyScreen').style.display = 'none';
  document.getElementById('gamePanel').style.display = 'flex';

  if (currentList.length === 0 || currentIndex >= currentList.length) {
    showEmpty();
    return;
  }

  var currentTask = currentList[currentIndex];

  document.getElementById('qPhrase').innerHTML = currentTask.phraseHtml;
  document.getElementById('qReading').textContent = currentTask.readingText;
  document.getElementById('qRu').textContent = currentTask.ru;

  var grid = document.getElementById('choicesGrid');
  grid.innerHTML = '';

  currentTask.choices.forEach(function(ch) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-main">${ch.main}</span>${ch.sub ? `<span class="choice-sub">${ch.sub}</span>` : ''}`;
    btn.onclick = function() { handleAnswer(ch.main); };
    grid.appendChild(btn);
  });

  var currentNum = currentIndex + 1;
  var total = currentList.length;
  var pct = Math.round((currentIndex / total) * 100);

  document.getElementById('progCountLabel').textContent = "Вопрос " + currentNum + " из " + total;
  document.getElementById('progPctLabel').textContent = pct + "%";
  document.getElementById('progressBar').style.width = pct + '%';

  // Автоозвучка при открытии вопроса удалена
}

function replayQuestionAudio() {
  if (currentList.length === 0 || currentIndex >= currentList.length) return;
  // До ответа озвучивает только начало фразы, после ответа — всю фразу
  if (isAnswered) {
    speak(currentList[currentIndex].kana);
  } else {
    speak(currentList[currentIndex].promptVoice);
  }
}

function replayAnswerAudio() {
  if (currentList.length === 0 || currentIndex >= currentList.length) return;
  speak(currentList[currentIndex].kana);
}

function handleAnswer(chosen) {
  if (isAnswered) return;
  isAnswered = true;

  var currentTask = currentList[currentIndex];
  var isCorrect = (chosen === currentTask.correct);
  var fbBox = document.getElementById('feedbackBox');

  fbBox.style.display = 'flex';

  if (isCorrect) {
    fbBox.className = 'feedback-box correct';
    document.getElementById('fbVerdict').textContent = 'Правильно! ✨';
    if (currentLevel === 'errors') {
      errorList = errorList.filter(function(e) { return e.rawId !== currentTask.rawId; });
    }
  } else {
    fbBox.className = 'feedback-box wrong';
    document.getElementById('fbVerdict').textContent = 'Ошибка ✕';
    var exists = errorList.some(function(e) { return e.rawId === currentTask.rawId; });
    if (!exists) {
      errorList.push(currentTask);
    }
  }

  document.getElementById('fbTypeTag').textContent = currentTask.typeTag;
  document.getElementById('fbFull').textContent = currentTask.full;
  document.getElementById('fbKana').textContent = currentTask.kana;
  document.getElementById('fbRule').innerHTML = currentTask.rule;

  // Озвучиваем правильный ответ только после выбора
  speak(currentTask.kana);
  updateUI();
}

function nextQuestion() {
  currentIndex++;
  renderCard();
}

function showEmpty() {
  document.getElementById('gamePanel').style.display = 'none';
  document.getElementById('emptyScreen').style.display = 'flex';
  document.getElementById('progCountLabel').textContent = "Завершено";
  document.getElementById('progPctLabel').textContent = "100%";
  document.getElementById('progressBar').style.width = '100%';

  if (currentLevel === 'errors') {
    document.getElementById('emptyTitle').textContent = errorList.length === 0 ? 'Ошибок нет!' : 'Круг ошибок завершен';
    document.getElementById('emptyDesc').textContent = errorList.length === 0 ? 'Все проблемные пары отработаны!' : 'Осталось ошибок: ' + errorList.length;
  } else {
    document.getElementById('emptyTitle').textContent = 'Уровень ' + currentLevel + ' завершён!';
    document.getElementById('emptyDesc').textContent = 'Отличная скорость и точность!';
  }
}

function restartLevel() {
  initLevel();
}

function switchLevel(lvl) {
  currentLevel = lvl;
  updateUI();
  initLevel();
}

function updateUI() {
  for (var i = 1; i <= 5; i++) {
    var btn = document.getElementById('lvlBtn' + i);
    if (btn) btn.className = (currentLevel === i) ? 'lvl-btn active' : 'lvl-btn';
  }
  var errBtn = document.getElementById('lvlBtnErr');
  if (errBtn) {
    errBtn.className = (currentLevel === 'errors') ? 'lvl-btn errors-btn active' : 'lvl-btn errors-btn';
    errBtn.textContent = 'Ошибки (' + errorList.length + ')';
  }
}

/* ==========================================================================
   ТЕОРИЯ
   ========================================================================== */
function openTheory() {
  var modal = document.getElementById('theoryModal');
  var mTitle = document.getElementById('modalTitle');
  var mBody = document.getElementById('modalBody');

  mTitle.textContent = "Секреты пар 自動詞 / 他動詞";
  mBody.innerHTML = `
    <p>В тестах JLPT N4 парные глаголы встречаются постоянно. Чтобы не зубрить их вслепую, запомните <strong>5 золотых правил</strong>:</p><br>

    <p><strong>1. Правило «〜す»: Всегда переходный (他動詞)</strong><br>
    Если в паре один глагол оканчивается на <code>す</code>, он <strong>100% требует частицу を</strong> (действие человека):<br>
    • 消える (гаснет сам) ➔ <strong>消す</strong> (выключаю)<br>
    • 壊れる (ломается само) ➔ <strong>壊す</strong> (ломаю)<br>
    • 落ちる (падает само) ➔ <strong>落とす</strong> (роняю)<br>
    • 倒れる (падает само) ➔ <strong>倒す</strong> (опрокидываю)</p><br>

    <p><strong>2. Правило «-e- против -u-»: Переходный на -e-</strong><br>
    В парах без -す глагол с гласным звуком <code>e</code> (一段) почти всегда переходный:<br>
    • 開く (あく - открывается) ➔ <strong>開ける</strong> (あける - открывать)<br>
    • 付く (つく - прикреплен) ➔ <strong>付ける</strong> (つける - прикреплять)<br>
    • 閉まる (しまる - закрывается) ➔ <strong>閉める</strong> (しめる - закрывать)<br>
    • 並ぶ (ならぶ - стоят в ряд) ➔ <strong>並べる</strong> (нараべる - расставлять)</p><br>

    <p><strong>3. Суффикс «〜れる»: Всегда непереходный (自動詞)</strong><br>
    Если глагол оканчивается на <code>れる</code>, он обозначает спонтанный процесс, который произошёл сам:<br>
    • <strong>折れる</strong> (ветка переломилась сама)<br>
    • <strong>割れる</strong> (стакан разбился сам)<br>
    • <strong>破れる</strong> (бумага порвалась сама)<br>
    • <strong>汚れる</strong> (одежда испачкалась)</p><br>

    <p><strong>4. Мега-ловушка N4: 〜ている</strong><br>
    • <strong>自動詞 + ている</strong> = <em>состояние результата</em> (действие уже произошло само, и мы видим итог):<br>
    <code>ドアが開いている</code> — дверь открыта (стоит открытая).<br>
    • <strong>他動詞 + ている</strong> = <em>процесс прямо сейчас</em>:<br>
    <code>ドアを開けている</code> — кто-то прямо сейчас открывает дверь.</p>
  `;

  modal.classList.add('show');
}

function closeTheory() {
  document.getElementById('theoryModal').classList.remove('show');
}

/* ==========================================================================
   ГОРЯЧИЕ КЛАВИШИ
   ========================================================================== */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeTheory();
  } else if (e.key === '1' || e.key === '2') {
    var idx = parseInt(e.key) - 1;
    var btns = document.querySelectorAll('.choice-btn');
    if (btns && btns[idx] && document.getElementById('feedbackBox').style.display !== 'flex') {
      btns[idx].click();
    }
  } else if (e.key === 'Enter') {
    var nextBtn = document.getElementById('btnNext');
    if (document.getElementById('feedbackBox').style.display === 'flex') {
      nextBtn.click();
    }
  }
});

// Старт
updateUI();
initLevel();
</script>
