<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Спряжатор N4: Глагольный конструктор</title>

  <!-- Google Fonts: Японский округлый шрифт -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Применение темы, сохранённой в главном меню -->
  <script>
    const savedTheme = localStorage.getItem('app_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      const themeColor = savedTheme === 'dark' ? '#181517' : '#fbf8ee';
      if (tg.setHeaderColor) tg.setHeaderColor(themeColor);
      if (tg.setBackgroundColor) tg.setBackgroundColor(themeColor);
    }
  </script>

  <style>
    /* ================= СВЕТЛАЯ ТЕМА ================= */
    :root {
      --cream: #fbf8ee;
      --paper: #ffffff;
      --ink: #4a3a36;
      --ink-soft: #8f8478;

      --strawberry: #ffc4d0;
      --strawberry-deep: #ec6f88;
      --strawberry-shadow: #af3952;

      --matcha: #d5e8b3;
      --matcha-deep: #8db55a;
      --matcha-shadow: #58792c;

      --peach: #ffd8bb;
      --peach-deep: #f0a06c;
      --peach-shadow: #b35f29;

      --pistachio: #cdeec4;
      --pistachio-deep: #78bf74;

      --apricot: #ffe6cc;
      --line: #f3e2d6;

      --icon-box-strawberry: #fff0f3;
      --icon-box-peach: #fff5ec;
      --icon-box-matcha: #f3f9e8;

      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    /* ================= ТЁМНАЯ ТЕМА ================= */
    [data-theme="dark"] {
      --cream: #181517;
      --paper: #231e22;
      --ink: #fdfaf6;
      --ink-soft: #a89ca0;

      --strawberry: #4e2933;
      --strawberry-deep: #ff7593;
      --strawberry-shadow: #943248;

      --matcha: #2e3b22;
      --matcha-deep: #9dcd60;
      --matcha-shadow: #4d6d24;

      --peach: #4d3324;
      --peach-deep: #f8a068;
      --peach-shadow: #a44f20;

      --apricot: #3d2a20;
      --line: #332b30;

      --icon-box-strawberry: #341e25;
      --icon-box-peach: #38251c;
      --icon-box-matcha: #232d1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--cream);
      color: var(--ink);
      font-family: 'M PLUS Rounded 1c', 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: calc(65px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px));
      transition: background-color 0.25s ease, color 0.25s ease, padding-top 0.2s ease;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(255, 196, 208, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(213, 232, 179, 0.25) 0%, transparent 40%);
      background-attachment: fixed;
      position: relative;
    }

    [data-theme="dark"] body {
      background-image:
        radial-gradient(circle at 15% 15%, rgba(236, 111, 136, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(141, 181, 90, 0.10) 0%, transparent 45%);
    }

    body.tg-fullscreen {
      padding-top: calc(85px + env(safe-area-inset-top, 0px)) !important;
    }

    /* Фоновые лепестки сакуры */
    .petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .petals span {
      position: absolute;
      top: -30px;
      width: 14px;
      height: 11px;
      background: var(--strawberry-deep);
      border-radius: 80% 0 80% 0;
      opacity: .5;
      animation: fall 14s linear infinite;
    }
    .petals span:nth-child(1) { left: 8%;  animation-delay: 0s;   animation-duration: 15s; }
    .petals span:nth-child(2) { left: 24%; animation-delay: -5s;  animation-duration: 18s; width: 10px; height: 8px; }
    .petals span:nth-child(3) { left: 42%; animation-delay: -9s;  animation-duration: 16s; background: var(--peach-deep); }
    .petals span:nth-child(4) { left: 61%; animation-delay: -3s;  animation-duration: 20s; width: 12px; height: 9px; }
    .petals span:nth-child(5) { left: 78%; animation-delay: -11s; animation-duration: 17s; background: var(--matcha-deep); }
    .petals span:nth-child(6) { left: 92%; animation-delay: -7s;  animation-duration: 19s; }

    @keyframes fall {
      0%   { transform: translate(0, 0) rotate(0deg); }
      50%  { transform: translate(28px, 55vh) rotate(180deg); }
      100% { transform: translate(-12px, 110vh) rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .petals { display: none; }
    }

    #app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    /* Верхняя панель (только кнопка Меню) */
    .top-bar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 2px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--paper);
      color: var(--ink);
      border: 2px solid var(--line);
      font-size: 13px;
      font-weight: 800;
      padding: 7px 16px;
      border-radius: 99px;
      box-shadow: 0 3px 0 var(--line);
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .nav-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--line);
    }

    /* Навигация по Уровням (1, 2, 3, 4, 5 + Ошибки) */
    .level-nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr) 2.2fr;
      gap: 5px;
      width: 100%;
    }

    .lvl-btn {
      padding: 9px 2px;
      border-radius: var(--radius-md);
      border: 2px solid var(--line);
      background: var(--paper);
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-shadow: 0 3px 0 var(--line);
      font-family: inherit;
      min-width: 0;
    }

    .lvl-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--line);
    }
    .lvl-btn.active {
      background: var(--peach-deep);
      color: #ffffff;
      border-color: var(--peach-deep);
      box-shadow: 0 3px 0 var(--peach-shadow);
    }

    .lvl-btn.errors-btn {
      color: var(--strawberry-deep);
      border-color: var(--strawberry);
      box-shadow: 0 3px 0 var(--strawberry);
    }
    .lvl-btn.errors-btn.active {
      background: var(--strawberry-deep);
      color: #ffffff;
      border-color: var(--strawberry-deep);
      box-shadow: 0 3px 0 var(--strawberry-shadow);
    }

    /* Баннер правил */
    .theory-banner {
      background: var(--paper);
      border: 2px dashed var(--peach-deep);
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--peach-deep);
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(240, 160, 108, 0.25);
      transition: all 0.15s ease;
    }
    .theory-banner:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(240, 160, 108, 0.25);
    }

    /* Прогресс-бар с карамельной полоской */
    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--ink-soft);
      font-weight: 700;
      padding: 0 4px;
    }
    .progress-container {
      width: 100%;
      height: 10px;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
      padding: 1px;
    }

    /* Карамельная полоса */
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      transition: width 0.25s ease;
      background: repeating-linear-gradient(135deg, var(--strawberry-deep) 0 10px, var(--strawberry) 10px 20px);
    }
    [data-theme="dark"] .progress-fill {
      background: repeating-linear-gradient(135deg, var(--strawberry-deep) 0 10px, #3d1c25 10px 20px);
    }

    /* Карточка вопроса */
    .card {
      position: relative;
      background: var(--paper);
      border: 2.5px solid var(--peach);
      box-shadow: 0 6px 0 var(--peach);
      border-radius: var(--radius-xl);
      padding: 24px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      transition: background 0.25s ease;
    }

    .btn-sound-corner {
      position: absolute;
      top: 14px;
      right: 14px;
    }

    .target-header {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0 36px;
    }

    /* Кандзи в вопросе: строго 500 */
    .target-phrase {
      font-size: 28px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.5px;
      line-height: 1.3;
    }

    .target-paren {
      color: var(--ink-soft);
      font-weight: 400;
    }

    .target-blank {
      color: var(--peach-deep);
      border-bottom: 3px dashed var(--peach-deep);
      padding: 0 6px;
      display: inline-block;
    }

    .target-reading {
      font-size: 15px;
      font-weight: 500;
      color: var(--ink-soft);
      letter-spacing: 0.5px;
      min-height: 22px;
    }

    .target-ru {
      font-size: 15px;
      font-weight: 700;
      color: var(--matcha-deep);
      line-height: 1.35;
      margin-top: 2px;
    }

    /* Кнопка звука */
    .btn-sound {
      background: var(--cream);
      border: 2px solid var(--line);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 2px 0 var(--line);
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-sound:active {
      transform: translateY(2px);
      box-shadow: 0 0 0 var(--line);
    }

    /* Сетка кнопок ответов 2х2 */
    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .choice-btn {
      background: var(--paper);
      border: 2.5px solid var(--line);
      box-shadow: 0 5px 0 var(--line);
      border-radius: var(--radius-lg);
      padding: 16px 8px;
      cursor: pointer;
      transition: all 0.12s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      word-break: keep-all;
      font-family: inherit;
    }
    .choice-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--line);
      border-color: var(--peach-deep);
    }

    /* Кандзи в кнопках ответов: строго 500 */
    .choice-main {
      font-size: 18px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.25;
    }

    /* Блок пояснения */
    .feedback-box {
      background: var(--paper);
      border-radius: var(--radius-xl);
      padding: 18px;
      display: none;
      flex-direction: column;
      gap: 12px;
      transition: all 0.2s ease;
    }
    .feedback-box.correct {
      border: 2.5px solid var(--matcha);
      box-shadow: 0 6px 0 var(--matcha);
      background: var(--icon-box-matcha);
    }
    .feedback-box.wrong {
      border: 2.5px solid var(--strawberry);
      box-shadow: 0 6px 0 var(--strawberry);
      background: var(--icon-box-strawberry);
    }

    .fb-title {
      font-size: 14.5px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .feedback-box.correct .fb-title { color: var(--matcha-deep); }
    .feedback-box.wrong .fb-title { color: var(--strawberry-deep); }

    .fb-body-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* Кандзи в плашке правильного ответа: строго 500 */
    .fb-full {
      font-size: 24px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.25;
    }
    .fb-kana {
      font-size: 14px;
      color: var(--ink-soft);
      font-weight: 500;
    }

    /* Пояснение ответа: тонкий шрифт 400 и персиковые акценты */
    .fb-rule {
      font-size: 13.5px;
      color: var(--ink);
      line-height: 1.6;
      background: var(--paper);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--line);
      font-weight: 400;
    }
    .fb-rule b, 
    .fb-rule strong {
      color: var(--peach-deep);
      font-weight: 700;
    }
    .fb-rule code {
      background: var(--cream);
      padding: 1px 5px;
      border-radius: 6px;
      font-family: inherit;
      color: var(--strawberry-deep);
      font-weight: 500;
      border: 1px solid var(--line);
    }
    .fb-step-line {
      margin-bottom: 5px;
    }
    .fb-step-line:last-child {
      margin-bottom: 0;
    }

    /* Основная кнопка действия */
    .btn-action {
      background: var(--strawberry-deep);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--strawberry-shadow);
      transition: all 0.12s ease;
      font-family: inherit;
      width: 100%;
    }
    .btn-action:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--strawberry-shadow);
    }

    /* Модальное окно теории */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 12, 14, 0.65);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .modal-backdrop.show {
      display: flex;
      opacity: 1;
    }

    .modal-card {
      background: var(--paper);
      border: 3px solid var(--line);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      gap: 14px;
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }
    .modal-backdrop.show .modal-card {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px dashed var(--line);
      padding-bottom: 12px;
    }
    .modal-icon {
      font-size: 28px;
    }
    .modal-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--ink);
      margin: 0;
    }

    /* Текст теории: тонкий 400, подтемы персиковые */
    .modal-body {
      font-size: 14px;
      line-height: 1.65;
      color: var(--ink);
      font-weight: 400;
    }
    .modal-body strong {
      font-weight: 600;
      color: var(--ink);
    }
    .modal-body p > strong:first-child {
      color: var(--peach-deep);
      font-weight: 700;
      display: inline-block;
      margin-bottom: 3px;
    }
    .modal-body code {
      background: var(--cream);
      padding: 1px 5px;
      border-radius: 6px;
      font-family: inherit;
      color: var(--strawberry-deep);
      font-weight: 500;
      border: 1px solid var(--line);
    }

    .modal-close-btn {
      background: var(--peach-deep);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--peach-shadow);
      font-family: inherit;
      transition: all 0.12s ease;
    }
    .modal-close-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--peach-shadow);
    }

    /* Экран завершения */
    .dialog-view {
      background: var(--paper);
      border: 2.5px solid var(--matcha);
      box-shadow: 0 6px 0 var(--matcha);
      border-radius: var(--radius-xl);
      padding: 36px 20px;
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .dialog-view h3 {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
    }
    .dialog-view p {
      font-size: 14.5px;
      color: var(--ink-soft);
      font-weight: 600;
    }
  </style>
</head>
<body>

<!-- Падающие лепестки сакуры -->
<div class="petals" aria-hidden="true">
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
</div>

<div id="app">
  <!-- Верхняя строка (только кнопка Меню) -->
  <div class="top-bar">
    <a href="index.html" class="nav-btn">← Меню</a>
  </div>

<!-- 1. Навигация по Уровням -->
  <div class="level-nav">
    <button type="button" class="lvl-btn active" id="lvlBtn1" onclick="switchLevel(1)" title="Пассив">1</button>
    <button type="button" class="lvl-btn" id="lvlBtn2" onclick="switchLevel(2)" title="Каузатив">2</button>
    <button type="button" class="lvl-btn" id="lvlBtn3" onclick="switchLevel(3)" title="Кауз-Пасс">3</button>
    <button type="button" class="lvl-btn" id="lvlBtn4" onclick="switchLevel(4)" title="Потенциал">4</button>
    <button type="button" class="lvl-btn" id="lvlBtn5" onclick="switchLevel(5)" title="ば / よう">5</button>
    <button type="button" class="lvl-btn errors-btn" id="lvlBtnErr" onclick="switchLevel('errors')">Ошибки (0)</button>
  </div>

  <!-- 2. Баннер правил -->
  <div class="theory-banner" onclick="openTheory()">
    <span>📖</span> Формулы спряжения и этикет
  </div>

  <!-- 3. Прогресс -->
  <div class="progress-wrap">
    <div class="progress-labels">
      <span id="progCountLabel">Вопрос 1</span>
      <span id="progPctLabel">0%</span>
    </div>
    <div class="progress-container">
      <div class="progress-fill" id="progressBar"></div>
    </div>
  </div>

  <!-- 4. Игровая панель -->
  <div id="gamePanel" style="display: flex; flex-direction: column; gap: 12px;">
    <div class="card">
      <button type="button" class="btn-sound btn-sound-corner" onclick="replayQuestionAudio()" title="Послушать фразу">🔊</button>
      
      <!-- КРУПНО: кандзи 500 -->
      <div class="target-header">
        <div class="target-phrase" id="qPhrase">絵に 触(る)＿＿</div>
      </div>
      <!-- СРЕДНЕ: чтение -->
      <div class="target-reading" id="qReading">えに さわ(る)＿＿</div>
      <!-- Перевод -->
      <div class="target-ru" id="qRu">прикасаться к картине</div>
    </div>

    <!-- 4 кнопки ответов (сетка 2х2) -->
    <div class="buttons-grid" id="choicesGrid"></div>

    <!-- Пояснение ответа -->
    <div class="feedback-box" id="feedbackBox">
      <div class="fb-title">
        <span id="fbVerdict">Верно!</span>
        <span id="fbTypeTag">1-я группа (五段)</span>
      </div>
      <div class="fb-body-wrap">
        <div>
          <!-- Кандзи 500 -->
          <div class="fb-full" id="fbFull">絵に 触られる</div>
          <div class="fb-kana" id="fbKana">えにさわられる</div>
        </div>
        <button type="button" class="btn-sound" onclick="replayAnswerAudio()" title="Послушать правильный ответ">🔊</button>
      </div>
      <div class="fb-rule" id="fbRule"></div>
      <button type="button" class="btn-action" id="btnNext" onclick="nextQuestion()">Дальше →</button>
    </div>
  </div>

  <!-- Экран окончания списка -->
  <div class="dialog-view" id="emptyScreen">
    <div style="font-size: 38px;">🎉</div>

/* ==========================================================================
   АЛГОРИТМИЧЕСКИЙ ДВИЖОК СПРЯЖЕНИЙ
   ========================================================================== */
var GODAN_MAP = {
  "う": { a: "わ", i: "い", e: "え", o: "おう", ba: "えば" },
  "く": { a: "か", i: "き", e: "け", o: "こう", ba: "けば" },
  "ぐ": { a: "が", i: "ぎ", e: "げ", o: "ごう", ba: "げば" },
  "す": { a: "さ", i: "し", e: "せ", o: "そう", ba: "せば" },
  "つ": { a: "た", i: "ち", e: "て", o: "とう", ba: "てば" },
  "ぬ": { a: "な", i: "に", e: "ね", o: "のう", ba: "ねば" },
  "ぶ": { a: "ば", i: "び", e: "べ", o: "ぼう", ba: "べば" },
  "む": { a: "ま", i: "み", e: "め", o: "もう", ba: "めば" },
  "る": { a: "ら", i: "り", e: "れ", o: "ろう", ba: "れば" }
};
GODAN_MAP["く"].a = "か";

function conjugateVerb(kanji, kana, group) {
  if (kana === "つとめます") kana = "つとめる";

  var forms = {};

  if (group === 3) {
    if (kanji === "来る" || kana === "くる") {
      forms.passive   = { k: "来られる", r: "こられる" };
      forms.causative = { k: "来させる", r: "こさせる" };
      forms.caus_pass = { k: "来させられる", r: "こさせられる" };
      forms.potential = { k: "来られる", r: "こられる" };
      forms.ba        = { k: "来れば", r: "くれば" };
      forms.volitional= { k: "来よう", r: "こよう" };
    } else {
      var prefixK = kanji.replace(/する$/, "");
      var prefixR = kana.replace(/する$/, "");
      forms.passive   = { k: prefixK + "される", r: prefixR + "される" };
      forms.causative = { k: prefixK + "させる", r: prefixR + "させる" };
      forms.caus_pass = { k: prefixK + "させられる", r: prefixR + "させられる" };
      forms.potential = { k: prefixK + "できる", r: prefixR + "できる" };
      forms.ba        = { k: prefixK + "すれば", r: prefixR + "すれば" };
      forms.volitional= { k: prefixK + "しよう", r: prefixR + "しよう" };
    }
    return forms;
  }

  if (group === 2) {
    var stemK = kanji.slice(0, -1);
    var stemR = kana.slice(0, -1);

    forms.passive   = { k: stemK + "られる", r: stemR + "られる" };
    forms.causative = { k: stemK + "させる", r: stemR + "させる" };
    forms.caus_pass = { k: stemK + "させられる", r: stemR + "させられる" };
    forms.potential = { k: stemK + "られる", r: stemR + "られる" };
    forms.ba        = { k: stemK + "れば",   r: stemR + "れば" };
    forms.volitional= { k: stemK + "よう",   r: stemR + "よう" };
    return forms;
  }

  // 1-я группа (Годан)
  var lastChar = kana.slice(-1);
  var stemK1 = kanji.slice(0, -1);
  var stemR1 = kana.slice(0, -1);
  var g = GODAN_MAP[lastChar];

  var causPassShortK = (lastChar !== "す") ? (stemK1 + g.a + "される") : (stemK1 + g.a + "せられる");
  var causPassShortR = (lastChar !== "す") ? (stemR1 + g.a + "される") : (stemR1 + g.a + "せられる");

  forms.passive   = { k: stemK1 + g.a + "れる", r: stemR1 + g.a + "れる" };
  forms.causative = { k: stemK1 + g.a + "せる", r: stemR1 + g.a + "せる" };
  forms.caus_pass = { k: causPassShortK, r: causPassShortR };
  forms.potential = { k: stemK1 + g.e + "る",   r: stemR1 + g.e + "る" };
  forms.ba        = { k: stemK1 + g.ba,         r: stemR1 + g.ba };
  forms.volitional= { k: stemK1 + g.o,          r: stemR1 + g.o };

  return forms;
}

/* ==========================================================================
   ФОРМАТИРОВАНИЕ ЗАДАНИЯ С ВЫНОСОМ ОКОНЧАНИЯ В СКОБКИ
   ========================================================================== */
function formatBlankPhrase(cK, cR, kanji, kana, group) {
  var phraseHtml = "";
  var readingText = "";

  if (group === 3) {
    if (kanji === "来る" || kana === "くる") {
      phraseHtml = `${cK} <span class="target-paren">(来る)</span><span class="target-blank">＿＿</span>`;
      readingText = `${cR} (くる)＿＿`;
    } else {
      var pK = kanji.replace(/する$/, "");
      var pR = kana.replace(/する$/, "");
      phraseHtml = `${cK} ${pK}<span class="target-paren">(する)</span><span class="target-blank">＿＿</span>`;
      readingText = `${cR} ${pR}(する)＿＿`;
    }
  } else {
    var stemK = kanji.slice(0, -1);
    var endK = kanji.slice(-1);
    var stemR = kana.slice(0, -1);
    var endR = kana.slice(-1);

    phraseHtml = `${cK} ${stemK}<span class="target-paren">(${endK})</span><span class="target-blank">＿＿</span>`;
    readingText = `${cR} ${stemR}(${endR})＿＿`;
  }

  return { phrase: phraseHtml, reading: readingText };
}

/* ==========================================================================
   ПОШАГОВЫЙ РАЗБОР ФОРМУЛЫ
   ========================================================================== */
function buildStepBreakdown(kanji, kana, group, fKey, targetObj, cKanji) {
  var grpName = (group === 1) ? "1-я группа (五段)" : ((group === 2) ? "2-я группа (一段)" : "3-я группа (исключение)");
  var steps = [];

  steps.push(`<div class="fb-step-line"><b>Глагол:</b> ${kanji} (${kana}) — ${grpName}</div>`);

  if (group === 3) {
    if (kanji === "来る" || kana === "くる") {
      steps.push(`<div class="fb-step-line"><b>Основа:</b> особое спряжение глагола <code>来る (くる)</code></div>`);

      steps.push(`<div class="fb-step-line"><b>Основа:</b> отбрасываем <code>する</code></div>`);
      steps.push(`<div class="fb-step-line"><b>Суффикс:</b> заменяем на <code>${targetObj.k.replace(kanji.replace(/する$/,''), '')}</code> ➔ <b>${targetObj.k}</b></div>`);
    }
  } else if (group === 2) {
    var stemK = kanji.slice(0, -1);
    var stemR = kana.slice(0, -1);
    steps.push(`<div class="fb-step-line"><b>Основа:</b> отбрасываем <code>る</code> ➔ ${stemK} (${stemR})</div>`);

    if (fKey === "passive" || fKey === "potential") {
      steps.push(`<div class="fb-step-line"><b>Суффикс:</b> добавляем <code>〜られる</code> ➔ <b>${targetObj.k}</b></div>`);
    } else if (fKey === "causative") {
      steps.push(`<div class="fb-step-line"><b>Суффикс:</b> добавляем <code>〜させる</code> ➔ <b>${targetObj.k}</b></div>`);
    } else if (fKey === "caus_pass") {
      steps.push(`<div class="fb-step-line"><b>Суффикс:</b> добавляем <code>〜させられる</code> ➔ <b>${targetObj.k}</b></div>`);
    } else if (fKey === "ba") {
      steps.push(`<div class="fb-step-line"><b>Суффикс:</b> добавляем <code>〜れば</code> ➔ <b>${targetObj.k}</b></div>`);
    } else if (fKey === "volitional") {
      steps.push(`<div class="fb-step-line"><b>Суффикс:</b> добавляем <code>〜よう</code> ➔ <b>${targetObj.k}</b></div>`);
    }
  } else {
    // 1 группа
    var last = kana.slice(-1);
    var stemK = kanji.slice(0, -1);
    var g = GODAN_MAP[last];

    if (fKey === "passive") {
      steps.push(`<div class="fb-step-line"><b>Основа:</b> меняем звук <code>${last} ➔ ${g.a}</code> (на -а) ➔ ${stemK}${g.a}</div>`);
      steps.push(`<div class="fb-step-line"><b>Суффикс:</b> добавляем <code>〜れる</code> ➔ <b>${targetObj.k}</b></div>`);
    } else if (fKey === "causative") {
      steps.push(`<div class="fb-step-line"><b>Основа:</b> меняем звук <code>${last} ➔ ${g.a}</code> (на -а) ➔ ${stemK}${g.a}</div>`);
      steps.push(`<div class="fb-step-line"><b>Суффикс:</b> добавляем <code>〜せる</code> ➔ <b>${targetObj.k}</b></div>`);
    } else if (fKey === "caus_pass") {
      steps.push(`<div class="fb-step-line"><b>Основа:</b> меняем звук <code>${last} ➔ ${g.a}</code> (на -а) ➔ ${stemK}${g.a}</div>`);
      if (last === "す") {
        steps.push(`<div class="fb-step-line"><b>Суффикс:</b> для глаголов на -す полная форма <code>〜せられる</code> ➔ <b>${targetObj.k}</b></div>`);
      } else {
        steps.push(`<div class="fb-step-line"><b>Суффикс:</b> сокращенная форма <code>〜される</code> ➔ <b>${targetObj.k}</b></div>`);
      }
    } else if (fKey === "potential") {
      steps.push(`<div class="fb-step-line"><b>Основа:</b> меняем звук <code>${last} ➔ ${g.e}</code> (на -э) ➔ ${stemK}${g.e}</div>`);
      steps.push(`<div class="fb-step-line"><b>Суффикс:</b> добавляем <code>〜る</code> ➔ <b>${targetObj.k}</b></div>`);
    } else if (fKey === "ba") {
      steps.push(`<div class="fb-step-line"><b>Основа:</b> меняем звук <code>${last} ➔ ${g.ba}</code> ➔ <b>${targetObj.k}</b></div>`);
    } else if (fKey === "volitional") {
      steps.push(`<div class="fb-step-line"><b>Основа:</b> меняем звук <code>${last} ➔ ${g.o}</code> ➔ <b>${targetObj.k}</b></div>`);
    }
  }

  if (fKey === "passive" && (cKanji.indexOf("が") !== -1 || cKanji.indexOf("に") !== -1 || cKanji.indexOf("で") !== -1)) {
    if (kanji === "降る" || kanji === "死ぬ" || kanji === "泣く" || kanji === "来る" || kanji === "走る" || kanji === "行く") {
      steps.push(`<div class="fb-step-line" style="margin-top: 6px; color: var(--peach-deep);">💡 <b>Нюанс:</b> непереходный глагол в пассиве выражает досаду (страдательный пассив 迷惑受身) — кто-то пострадал от этого действия.</div>`);
    }
  }

  return steps.join("");
}

/* ==========================================================================
   ОЗВУЧКА
   ========================================================================== */
var jaVoice = null;
function initVoices() {
  if (!('speechSynthesis' in window)) return;
  var voices = window.speechSynthesis.getVoices();
  jaVoice = voices.find(function(v) { 
    return (v.lang === 'ja-JP' || v.lang === 'ja_JP' || v.lang.indexOf('ja') === 0) && 
           (v.name.toLowerCase().indexOf('kyoko') !== -1 || v.name.indexOf('Google 日本語') !== -1 || v.name.indexOf('Siri') !== -1);
  }) || voices.find(function(v) { 
    return v.lang === 'ja-JP' || v.lang === 'ja_JP' || v.lang.indexOf('ja') === 0; 
  }) || null;
}
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = initVoices;
  initVoices();
}
function speak(text) {
  if (!('speechSynthesis' in window) || !text) return;
  try {
    window.speechSynthesis.cancel();
    var msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'ja-JP';
    msg.rate = 0.88;
    if (jaVoice) msg.voice = jaVoice;
    window.speechSynthesis.speak(msg);
  } catch (e) {}
}

function shuffleArray(arr) {
  var copy = arr.slice();
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = copy[i];
    copy[i] = copy[j];
    copy[j] = temp;
  }
  return copy;
}

/* ==========================================================================
   ГЕНЕРАТОР КОЛОДЫ
   ========================================================================== */
function generateLevelDeck(level) {
  var deck = [];
  var targetFormKeys = [];

  if (level === 1) targetFormKeys = ["passive"];
  if (level === 2) targetFormKeys = ["causative"];
  if (level === 3) targetFormKeys = ["caus_pass"];
  if (level === 4) targetFormKeys = ["potential"];
  if (level === 5) targetFormKeys = ["ba", "volitional"];

  CONJUGATION_VERBS_DATA.forEach(function(item) {
    var kanji   = item[0];
    var kana    = (item[1] === "つとめます") ? "つとめる" : item[1];
    var group   = item[2];
    var cKanji  = item[4];
    var cKana   = item[5];
    var natRu   = item[6];

    var forms = conjugateVerb(kanji, kana, group);
    var formatted = formatBlankPhrase(cKanji, cKana, kanji, kana, group);

    targetFormKeys.forEach(function(fKey) {
      var targetObj = forms[fKey];

      var otherKeys = ["passive", "causative", "caus_pass", "potential", "ba", "volitional"].filter(function(k) {
        return k !== fKey && forms[k].k !== targetObj.k;
      });
      var shuffledOther = shuffleArray(otherKeys).slice(0, 3);
      var choices = shuffledOther.map(function(k) { return forms[k].k; });
      choices.push(targetObj.k);
      choices = shuffleArray(choices);

      var grpName = (group === 1) ? "1-я группа (五段)" : ((group === 2) ? "2-я группа (一段)" : "3-я группа (исключение)");
      var ruleHtml = buildStepBreakdown(kanji, kana, group, fKey, targetObj, cKanji);

      var ruText = natRu;
      if (level === 5) {
        ruText = (fKey === "ba") ? `Если: ${natRu}` : `Давай: ${natRu}`;
      }

      deck.push({
        rawId: kanji + "_" + fKey,
        rawVoiceText: cKana + kana,
        phraseHtml: formatted.phrase,
        readingText: formatted.reading,
        ru: ruText,
        choices: choices,
        correct: targetObj.k,
        full: cKanji + " " + targetObj.k,
        kana: cKana + targetObj.r,
        rule: ruleHtml,
        typeTag: grpName
      });
    });
  });

  return shuffleArray(deck);
}

/* ==========================================================================
   УПРАВЛЕНИЕ ИГРОЙ
   ========================================================================== */
var currentLevel = 1;
var currentIndex = 0;
var currentList = [];
var errorList = [];
var isAnswered = false;

function initLevel() {
  if (currentLevel === 'errors') {
    currentList = errorList.slice();
  } else {
    currentList = generateLevelDeck(currentLevel);
  }
  currentIndex = 0;
  renderCard();
}

function renderCard() {
  isAnswered = false;
  document.getElementById('feedbackBox').style.display = 'none';
  document.getElementById('emptyScreen').style.display = 'none';
  document.getElementById('gamePanel').style.display = 'flex';

  if (currentList.length === 0 || currentIndex >= currentList.length) {
    showEmpty();
    return;
  }

  var currentTask = currentList[currentIndex];

  document.getElementById('qPhrase').innerHTML = currentTask.phraseHtml;
  document.getElementById('qReading').textContent = currentTask.readingText;
  document.getElementById('qRu').textContent = currentTask.ru;

  var grid = document.getElementById('choicesGrid');
  grid.innerHTML = '';

  currentTask.choices.forEach(function(ch) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-main">${ch}</span>`;
    btn.onclick = function() { handleAnswer(ch); };
    grid.appendChild(btn);
  });

  var currentNum = currentIndex + 1;
  var total = currentList.length;
  var pct = Math.round((currentIndex / total) * 100);

  document.getElementById('progCountLabel').textContent = "Вопрос " + currentNum + " из " + total;
  document.getElementById('progPctLabel').textContent = pct + "%";
  document.getElementById('progressBar').style.width = pct + '%';

  speak(currentTask.rawVoiceText);
}

function replayQuestionAudio() {
  if (currentList.length === 0 || currentIndex >= currentList.length) return;
  speak(currentList[currentIndex].rawVoiceText);
}

function replayAnswerAudio() {
  if (currentList.length === 0 || currentIndex >= currentList.length) return;
  speak(currentList[currentIndex].kana);
}

function handleAnswer(chosen) {
  if (isAnswered) return;
  isAnswered = true;

  var currentTask = currentList[currentIndex];
  var isCorrect = (chosen === currentTask.correct);
  var fbBox = document.getElementById('feedbackBox');

  fbBox.style.display = 'flex';

  if (isCorrect) {
    fbBox.className = 'feedback-box correct';
    document.getElementById('fbVerdict').textContent = 'Правильно! ✨';
    if (currentLevel === 'errors') {
      errorList = errorList.filter(function(e) { return e.rawId !== currentTask.rawId; });
    }
  } else {
    fbBox.className = 'feedback-box wrong';
    document.getElementById('fbVerdict').textContent = 'Ошибка ✕';
    var exists = errorList.some(function(e) { return e.rawId === currentTask.rawId; });
    if (!exists) {
      errorList.push(currentTask);
    }
  }

  document.getElementById('fbTypeTag').textContent = currentTask.typeTag;
  document.getElementById('fbFull').textContent = currentTask.full;
  document.getElementById('fbKana').textContent = currentTask.kana;
  document.getElementById('fbRule').innerHTML = currentTask.rule;

  speak(currentTask.kana);
  updateUI();
}

function nextQuestion() {
  currentIndex++;
  renderCard();
}

function showEmpty() {
  document.getElementById('gamePanel').style.display = 'none';
  document.getElementById('emptyScreen').style.display = 'flex';
  document.getElementById('progCountLabel').textContent = "Завершено";
  document.getElementById('progPctLabel').textContent = "100%";
  document.getElementById('progressBar').style.width = '100%';

  if (currentLevel === 'errors') {
    document.getElementById('emptyTitle').textContent = errorList.length === 0 ? 'Ошибок нет!' : 'Круг ошибок завершен';
    document.getElementById('emptyDesc').textContent = errorList.length === 0 ? 'Все глаголы исправлены!' : 'Осталось ошибок: ' + errorList.length;
  } else {
    document.getElementById('emptyTitle').textContent = 'Уровень ' + currentLevel + ' завершён!';
    document.getElementById('emptyDesc').textContent = 'Все задания уровня пройдены!';
  }
}

function restartLevel() {
  initLevel();
}

function switchLevel(lvl) {
  currentLevel = lvl;
  updateUI();
  initLevel();
}

function updateUI() {
  for (var i = 1; i <= 5; i++) {
    var btn = document.getElementById('lvlBtn' + i);
    if (btn) btn.className = (currentLevel === i) ? 'lvl-btn active' : 'lvl-btn';
  }
  var errBtn = document.getElementById('lvlBtnErr');
  if (errBtn) {
    errBtn.className = (currentLevel === 'errors') ? 'lvl-btn errors-btn active' : 'lvl-btn errors-btn';
    errBtn.textContent = 'Ошибки (' + errorList.length + ')';
  }
}

      &nbsp;&nbsp;• す<b>る</b> ➔ <b>すれば</b><br>

  }

  modal.classList.add('show');
}

function closeTheory() {
  document.getElementById('theoryModal').classList.remove('show');
}

/* ==========================================================================
   КЛАВИАТУРА (1-4, ENTER, ESCAPE)
   ========================================================================== */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeTheory();
  } else if (e.key >= '1' && e.key <= '4') {
    var idx = parseInt(e.key) - 1;
    var btns = document.querySelectorAll('.choice-btn');
    if (btns && btns[idx] && document.getElementById('feedbackBox').style.display !== 'flex') {
      btns[idx].click();
    }
  } else if (e.key === 'Enter') {
    var nextBtn = document.getElementById('btnNext');
    if (document.getElementById('feedbackBox').style.display === 'flex') {
      nextBtn.click();
    }
  }
});

initLevel();
